<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF7F1">
  <title>六科学园</title>
  <style>
:root {
  --bg: #FBF7F1;
  --surface: #FFFFFF;
  --surface-2: #F4EEE6;
  --ink: #2B2622;
  --ink-2: #6E655C;
  --ink-3: #A79E94;
  --line: #ECE4DA;
  --ok: #3FA772;
  --ok-soft: #E3F5EA;
  --bad: #E0795B;
  --bad-soft: #FCEBE4;
  --gold: #F2B640;
  --world: #7E8FA6;

  --fashion: #E46A9C;
  --fashion-soft: #FDEAF2;
  --history: #C8664A;
  --history-soft: #FBE9E2;
  --geo: #2F9E8F;
  --geo-soft: #DFF4F0;
  --finance: #D99A2B;
  --finance-soft: #FCF1DC;
  --psych: #7C6BD6;
  --psych-soft: #ECE9FB;
  --english: #3D86D9;
  --english-soft: #E3EFFC;

  --accent: #7C6BD6;
  --soft: #ECE9FB;

  --fs-display: 30px;
  --fs-h1: 24px;
  --fs-h2: 19px;
  --fs-body: 17px;
  --fs-small: 14px;
  --fs-tiny: 12px;

  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 20px;
  --s6: 24px;
  --s8: 32px;
  --s10: 40px;

  --r-sm: 10px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 28px;
  --r-pill: 999px;

  --sh-1: 0 1px 2px rgba(60, 40, 20, .06), 0 2px 8px rgba(60, 40, 20, .05);
  --sh-2: 0 6px 24px rgba(60, 40, 20, .10);

  --ease-out: cubic-bezier(.22, 1, .36, 1);
  --ease-in: cubic-bezier(.55, 0, 1, .45);
  --ease-inout: cubic-bezier(.65, 0, .35, 1);
  --ease-back: cubic-bezier(.34, 1.56, .64, 1);
  --ease-anticip: cubic-bezier(.36, -0.4, .6, 1);

  --t-fast: 140ms;
  --t-base: 240ms;
  --t-slow: 420ms;
  --t-celebrate: 900ms;

  --font: -apple-system, "PingFang SC", "HarmonyOS Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --pad: 20px;
  --tab-h: 64px;
}

</style>
  <style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; overflow-x: hidden; }
html { background: #F3EBE1; }
body {
  font-family: var(--font);
  color: var(--ink);
  background: #F3EBE1;
  font-size: var(--fs-body);
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
button, input { font-family: inherit; color: inherit; }
[hidden] { display: none !important; }
button { cursor: pointer; }
#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  background: var(--bg);
  position: relative;
  overflow-x: hidden;
}
#stage { min-height: 100dvh; }
.screen {
  min-height: 100dvh;
  padding: 0 var(--pad) var(--s6);
  overflow-x: hidden;
}
.screen.has-tab { padding-bottom: calc(var(--tab-h) + 28px + env(safe-area-inset-bottom)); }
.today-screen.has-tab { padding-bottom: calc(64px + 24px + env(safe-area-inset-bottom)); }
.num { font-variant-numeric: tabular-nums; }
h1, h2, p { margin: 0; }
.topbar, .lesson-top {
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s3);
}
.lesson-top { height: 52px; position: sticky; top: 0; background: var(--bg); z-index: 5; margin: 0 calc(var(--pad) * -1); padding: 0 var(--pad); }
.top-kicker { font-size: var(--fs-small); line-height: 1.5; color: var(--ink-2); font-weight: 500; }
.top-actions { display: flex; align-items: center; gap: var(--s1); }
.icon-btn, .flame-btn, .tab, .zoom-btn, .pill, .layer-tab {
  min-height: 48px;
}
.icon-btn {
  width: 48px; height: 48px; border: 0; background: transparent; color: var(--ink);
  border-radius: var(--r-pill); display: grid; place-items: center;
}
.flame-btn {
  border: 0; background: transparent; display: flex; align-items: center; gap: 2px;
  min-width: 48px; padding: 0 var(--s2); color: var(--ink);
}
.streak-num { font-size: var(--fs-small); font-weight: 650; }
.flame { transform-origin: bottom center; animation: flame 1.6s var(--ease-inout) infinite; }
@keyframes flame {
  0% { transform: scaleY(1); }
  35% { transform: scaleY(1.06); }
  70% { transform: scaleY(.98); }
  100% { transform: scaleY(1); }
}
#tabbar {
  position: fixed; left: 50%; bottom: 0; transform: translateX(-50%);
  width: min(480px, 100%); height: calc(var(--tab-h) + env(safe-area-inset-bottom));
  background: var(--surface); border-top: 1px solid var(--line);
  display: flex; z-index: 30; padding-bottom: env(safe-area-inset-bottom);
}
#tabbar.is-hidden { visibility: hidden; pointer-events: none; }
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-decoration: none; color: var(--ink-3); font-size: var(--fs-tiny); font-weight: 500; gap: 2px;
}
.tab.is-on { color: var(--psych); }
.tab.is-on .tab-ico { transform: translateY(-2px); }
.tab-ico { display: grid; height: 22px; }
.btn {
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 54px; border: 0; border-radius: var(--r-pill);
  font-size: 17px; font-weight: 650; margin-top: var(--s3);
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-secondary { background: var(--surface-2); color: var(--ink); }
.btn-gold { background: var(--gold); color: var(--ink); }
.btn:disabled { opacity: .45; }
.greet { display: flex; gap: var(--s3); align-items: flex-end; margin: var(--s2) 0 var(--s4); }
.bubble {
  background: var(--surface); border-radius: 18px 18px 18px 6px;
  padding: var(--s3) var(--s4); box-shadow: var(--sh-1);
  font-size: var(--fs-body); line-height: 1.55; flex: 1;
}
.mascot { display: block; overflow: visible; }
.mascot-bob { transform-origin: 50% 85%; animation: bob 2.4s var(--ease-inout) infinite alternate; }
.mascot-bob.no-bob { animation: none; }
.note-flag { transform-origin: 42px 36px; }
.eye-g { transform-box: fill-box; transform-origin: center; }
@keyframes bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
.ring-wrap { width: 120px; height: 120px; margin: var(--s2) auto var(--s4); position: relative; }
.ring-label {
  position: absolute; inset: 0; display: flex; align-items: baseline; justify-content: center; padding-top: 46px;
}
.ring-label b { font-size: var(--fs-h1); line-height: 1; font-weight: 700; }
.ring-label span { color: var(--ink-2); font-size: var(--fs-small); margin-left: 2px; }
.chest-cta { margin-bottom: var(--s4); }
.banner, .finale {
  background: var(--surface); border-radius: var(--r-lg); padding: var(--s4);
  box-shadow: var(--sh-1); margin-bottom: var(--s4);
}
.finale { border: 1.5px solid var(--gold); }
.finale h2 { font-size: var(--fs-h1); line-height: 1.3; font-weight: 700; }
.finale p, .banner { color: var(--ink-2); font-size: var(--fs-small); }
.card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3); }
.subj-card, .boss-card {
  position: relative; text-align: left; border: 0; border-radius: var(--r-lg);
  padding: 10px 12px 8px; min-height: 148px; height: auto; display: flex; flex-direction: column;
  box-shadow: var(--sh-1);
}
.subj-card:active, .boss-card:active { box-shadow: var(--sh-1); }
.boss-card {
  grid-column: 1 / -1; height: auto; min-height: 96px;
  background: #fffdf8; border: 1.5px solid var(--gold);
}
.ord {
  position: absolute; top: 8px; left: 8px; width: 18px; height: 18px; border-radius: 50%;
  background: #fff; font-size: 11px; font-weight: 650; display: grid; place-items: center;
}
.emo { font-size: 28px; line-height: 32px; margin-left: 22px; height: 32px; }
.subname { font-size: var(--fs-small); font-weight: 650; margin-top: 2px; }
.card-title {
  font-size: 15px; line-height: 1.35; font-weight: 650; margin-top: 2px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
}
.card-meta {
  margin-top: auto; display: flex; align-items: center; justify-content: space-between;
  font-size: var(--fs-tiny); color: var(--ink-2);
}
.go {
  width: 28px; height: 28px; border-radius: 50%; background: #fff;
  display: grid; place-items: center; font-weight: 650;
}
.star-row { display: inline-flex; gap: 1px; }
.star-ico { width: 16px; height: 16px; display: block; }
.result-star .star-ico { width: 42px; height: 42px; }
.boss-kicker { color: #A87420; font-size: var(--fs-tiny); font-weight: 650; }
.mini-row {
  margin-top: var(--s4); min-height: 48px; display: flex; align-items: center; justify-content: space-between;
  gap: var(--s3); font-size: var(--fs-small); color: var(--ink-2);
}
.switch {
  width: 51px; height: 31px; min-height: 31px; border-radius: 31px; border: 0; background: #E4DCD2;
  position: relative; flex: 0 0 auto; padding: 0;
}
.switch i {
  position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
  background: #fff; box-shadow: var(--sh-1); transition: transform var(--t-fast) var(--ease-out);
}
.switch.is-on { background: var(--accent); }
.switch.is-on i { transform: translateX(20px); }
.today-screen > .boss-card { width: 100%; margin: 0 0 var(--s3); }
.lesson-screen { display: flex; flex-direction: column; padding-bottom: 0; }
.phase-body { flex: 1; padding-bottom: 12px; }
.lesson-foot {
  position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 18px);
  padding: 8px 0 max(16px, env(safe-area-inset-bottom));
}
.seg-host { flex: 1; }
.segs { display: flex; gap: 4px; align-items: center; }
.seg { flex: 1; height: 6px; border-radius: var(--r-pill); background: var(--surface-2); overflow: hidden; }
.seg-fill { display: block; height: 100%; width: 100%; background: var(--accent); transform: scaleX(0); transform-origin: left center; }
.seg.is-done .seg-fill, .seg.is-now.is-done .seg-fill { transform: scaleX(1); }
.star-slot { display: flex; align-items: center; }
.lesson-mascot { width: 40px; height: 40px; }
.stage-card {
  background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--sh-1);
  padding: var(--s5) var(--s4); transform-style: preserve-3d;
}
.hook-card { background: var(--soft); min-height: 280px; display: flex; flex-direction: column; justify-content: center; }
.tag {
  display: inline-flex; align-self: flex-start; background: #fff; color: var(--accent);
  border-radius: var(--r-pill); padding: 2px 10px; font-size: var(--fs-tiny); font-weight: 650;
}
.hook-text, .take-text, .q-text {
  font-size: var(--fs-h2); line-height: 1.45; font-weight: 650; margin-top: var(--s3);
}
.card-h { font-size: var(--fs-h2); line-height: 1.4; font-weight: 650; }
.step-list { margin-top: var(--s4); display: flex; flex-direction: column; gap: var(--s3); }
.step {
  position: relative; display: grid; grid-template-columns: 22px 1fr; gap: var(--s2);
  text-align: left; background: transparent; border: 0; padding: 0; width: 100%;
}
.step-bar {
  position: absolute; left: 0; top: 4px; bottom: 4px; width: 4px; border-radius: 4px;
  background: var(--accent); transform: scaleY(0); transform-origin: top;
}
.step-no {
  width: 22px; height: 22px; margin-left: 10px; border-radius: 50%; background: var(--soft);
  color: var(--accent); font-size: 12px; font-weight: 650; display: grid; place-items: center;
}
.step-body { display: flex; flex-direction: column; gap: var(--s2); min-width: 0; }
.step-text { font-size: var(--fs-body); line-height: 1.65; }
.step-past { opacity: 1; }
.step-past .step-text, .step-past .formula { opacity: .55; }
.step-past .viz { opacity: 1; }
.step-past .step-text { display: block; }
.step-past.is-open .step-text, .step-past.is-open .formula { opacity: 1; }
.step-past.is-open .step-text { -webkit-line-clamp: unset; display: block; }
.formula {
  background: var(--surface-2); border-radius: var(--r-sm); text-align: center;
  padding: 10px 12px; font-weight: 650; font-size: var(--fs-small);
}
.opt-list { display: flex; flex-direction: column; gap: var(--s3); margin-top: var(--s4); }
.opt, .swatch-opt, .listen-opt {
  min-height: 56px; text-align: left; background: #fff; border: 1.5px solid var(--line);
  border-radius: var(--r-md); padding: 12px 14px; font-size: var(--fs-body); line-height: 1.45;
  transition: border-color var(--t-fast) var(--ease-out), background-color var(--t-fast) var(--ease-out);
}
.opt.is-ok, .swatch-opt.is-ok { background: var(--ok-soft); border-color: var(--ok); }
.opt.is-bad, .swatch-opt.is-bad, .order-card.is-bad { background: var(--bad-soft); border-color: var(--bad); }
.opt.is-reveal, .swatch-opt.is-reveal { border-color: var(--ok); }
.explain { display: grid; grid-template-rows: 0fr; }
.explain-clip { overflow: hidden; }
.explain-k { font-weight: 650; margin-top: var(--s3); }
.explain-why { color: var(--ink-2); font-size: var(--fs-small); margin-top: var(--s1); }
.inter-prompt { font-size: var(--fs-h2); font-weight: 650; line-height: 1.4; }
.inter-note { color: var(--ink-2); font-size: var(--fs-small); margin-top: var(--s3); }
.order-list, .sort-pool { display: flex; flex-direction: column; gap: var(--s2); margin-top: var(--s3); }
.order-card, .sort-card {
  min-height: 48px; display: flex; align-items: center; gap: var(--s2);
  background: #fff; border: 1.5px solid var(--line); border-radius: var(--r-md);
  padding: 10px 12px; text-align: left; font-size: var(--fs-small);
  touch-action: none; user-select: none;
}
.order-tx { flex: 1; min-width: 0; }
.order-nudges { margin-left: auto; display: flex; gap: 4px; flex: 0 0 auto; }
.order-nudge {
  width: 32px; height: 32px; border: 0; border-radius: 8px; background: var(--surface-2);
  color: var(--ink); font-size: 16px; padding: 0;
}
.order-card.is-lift { transform: scale(1.04); box-shadow: var(--sh-2); z-index: 3; position: relative; }
.order-handle { color: var(--ink-3); letter-spacing: -1px; }
.order-card .hint { display: block; width: 100%; color: var(--bad); font-style: normal; font-size: var(--fs-tiny); }
.sort-bins { display: flex; flex-wrap: wrap; gap: var(--s2); margin-top: var(--s4); }
.bin {
  flex: 1 1 140px; min-height: 72px; border-radius: var(--r-md); border: 1.5px dashed var(--accent);
  background: var(--soft); padding: var(--s2); text-align: left;
}
.bin-name { display: block; font-weight: 650; font-size: var(--fs-small); color: var(--accent); }
.sort-card.is-selected { border-color: var(--accent); }
.sort-chip { width: 14px; height: 28px; border-radius: 4px; flex: 0 0 auto; }
.slider-row { display: block; margin-top: var(--s4); }
.slider-label { display: flex; justify-content: space-between; font-size: var(--fs-small); margin-bottom: var(--s2); }
input[type="range"] {
  -webkit-appearance: none; appearance: none; width: 100%; height: 48px;
  background: transparent; accent-color: var(--accent);
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 6px; border-radius: 999px;
  background: linear-gradient(to right, var(--accent) var(--fill, 0%), var(--surface-2) var(--fill, 0%));
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 28px; height: 28px; margin-top: -11px;
  border-radius: 50%; background: #fff; border: 2px solid var(--accent); box-shadow: var(--sh-1);
}
input[type="range"]::-moz-range-track { height: 6px; background: var(--surface-2); border: 0; border-radius: 999px; }
input[type="range"]::-moz-range-progress { height: 6px; background: var(--accent); border-radius: 999px; }
input[type="range"]::-moz-range-thumb {
  width: 28px; height: 28px; border-radius: 50%; background: #fff; border: 2px solid var(--accent);
}
.formula-stack { display: flex; flex-direction: column; gap: var(--s2); margin-top: var(--s3); }
.formula-k { font-size: var(--fs-tiny); color: var(--ink-2); font-weight: 500; }
.swatch-opt { display: flex; flex-direction: column; gap: var(--s2); }
.swatch-row, .viz-swatches { display: flex; gap: var(--s2); flex-wrap: wrap; }
.swatch-row i, .viz-swatch i {
  width: 40px; height: 56px; border-radius: 8px; display: block;
}
.swatch-weight { display: flex; height: 56px; width: 100%; border-radius: 8px; overflow: hidden; }
.swatch-weight i { height: 56px; display: block; }
.swatch-label {
  font-size: var(--fs-small); opacity: 0; height: 0; overflow: hidden;
}
.swatch-label.is-shown { opacity: 1; height: auto; transition: opacity 120ms linear; }
.listen-bar { display: flex; align-items: center; gap: var(--s3); margin-top: var(--s4); }
.speak-btn {
  width: 56px; height: 56px; min-height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: #fff;
  padding: 0; font-weight: 650; position: relative; display: grid; place-items: center;
}
.speak-btn span { font-size: 20px; line-height: 1; margin-left: 3px; }
.tts-btn {
  min-height: 48px; border-radius: var(--r-pill); border: 0; background: var(--soft); color: var(--accent);
  padding: 0 18px; font-weight: 650; position: relative; text-align: left;
}
.speak-btn.is-speaking::after, .tts-btn.is-speaking::after {
  content: ""; position: absolute; inset: -6px; border-radius: inherit; border: 2px solid var(--accent);
  animation: ripple 1s var(--ease-out) infinite; opacity: .5;
}
@keyframes ripple { from { transform: scale(.4); opacity: .5; } to { transform: scale(1.6); opacity: 0; } }
.listen-text { background: var(--surface-2); border-radius: var(--r-sm); padding: var(--s3); }
.tts-list { display: flex; flex-direction: column; gap: var(--s2); margin-top: var(--s4); align-items: flex-start; }
.sort-status:empty { display: none; }
.sort-status { color: var(--bad); }
.map-block { margin-top: var(--s2); }
.map-frame { position: relative; }
.map-block { margin-left: calc(var(--pad) * -1); margin-right: calc(var(--pad) * -1); }
.map-grid {
  display: grid;
  grid-template-columns: repeat(10, min(40px, calc((100vw - 40px) / 10)));
  grid-auto-rows: min(40px, calc((100vw - 40px) / 10));
  gap: 2px; width: max-content; max-width: 100%; margin: 0 auto; justify-content: center;
}
.tile {
  position: relative; border: 0; border-radius: 8px; background: var(--surface-2); color: var(--ink);
  width: min(40px, calc((100vw - 40px) / 10));
  height: min(40px, calc((100vw - 40px) / 10));
  min-width: 0; min-height: 0; padding: 0; overflow: hidden;
}
.tile-tx { position: relative; z-index: 1; font-size: 11px; font-weight: 650; line-height: 1.1; }
.tile-long .tile-tx { font-size: 8px; }
.tile-veil {
  position: absolute; inset: 0; background: var(--geo-soft); opacity: 0; border-radius: inherit;
  box-shadow: inset 0 0 0 1.5px var(--geo);
}
.tile.is-lit { color: var(--ink); }
.tile-tip {
  position: absolute; left: 50%; bottom: calc(100% + 4px); transform: translateX(-50%);
  background: var(--ink); color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 6px;
  white-space: nowrap; z-index: 2;
}
.map-overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.map-note, .empty { color: var(--ink-3); font-size: var(--fs-tiny); margin-top: var(--s3); }
.map-block.is-dim { filter: grayscale(1); opacity: .55; }
.layer-tabs, .zoom-row, .pills, .rate-row { display: flex; gap: var(--s2); flex-wrap: wrap; margin: var(--s2) 0 var(--s3); }
.layer-tab, .zoom-btn, .pill {
  border: 0; background: var(--surface-2); border-radius: var(--r-pill); padding: 0 14px;
  font-size: var(--fs-small); color: var(--ink-2);
}
.layer-tab.is-on, .zoom-btn.is-on, .pill.is-on { background: var(--ink); color: #fff; }
.layer-tab.is-locked { color: var(--ink-3); }
.tl-scroll { position: relative; overflow: hidden; touch-action: none; height: 340px; margin: 0 calc(var(--pad) * -1); }
.tl-lane-label {
  position: absolute; left: 8px; z-index: 5; pointer-events: none;
  font-size: 12px; font-weight: 650; color: var(--ink-2);
  background: rgba(251, 247, 241, .92); padding: 2px 6px; border-radius: 6px;
}
.tl-lane-label.is-cn { top: 8px; }
.tl-lane-label.is-world { top: 200px; }
.tl-canvas { position: relative; height: 340px; will-change: transform; }
.tl-china, .tl-world, .tl-axis { position: relative; }
.tl-china { height: 148px; }
.tl-axis { height: 44px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.tl-world { height: 140px; }

  const ANTICIP = 'cubic-bezier(.36,-0.4,.6,1)';

  function reduce() {
    const store = global.LKStore;
    const setting = store && store.get && store.get().settings.reduceMotion;
    const sys = global.matchMedia && global.matchMedia('(prefers-reduced-motion: reduce)').matches;
    return !!(setting || sys);
  }

  function syncRoot() {
    document.documentElement.classList.toggle('reduce', reduce());
  }

  let pressed = null;

  function pressDown(el) {
    if (!el || el.disabled || el.getAttribute('aria-disabled') === 'true' || el.dataset.noPress === '1') return;
    pressed = el;
    if (el.classList.contains('opt') || el.classList.contains('swatch-opt') || el.classList.contains('listen-opt')) {
      el.animate(
        [{ transform: 'scale(1)' }, { transform: 'scale(.97)' }],
        { duration: 80, easing: OUT, fill: 'forwards' }
      );
      return;
    }
    if (reduce()) {
      el.animate([{ opacity: 1 }, { opacity: .72 }], { duration: 80, fill: 'forwards' });
      return;
    }
    el.animate(
      [{ transform: 'scale(1, 1)' }, { transform: 'scale(0.96, 0.92)' }],
      { duration: 80, easing: OUT, fill: 'forwards' }
    );
  }

  function pressUp() {
    const el = pressed;
    pressed = null;
    if (!el) return;
    if (el.classList.contains('opt') || el.classList.contains('swatch-opt') || el.classList.contains('listen-opt')) {
      if (reduce()) {
        el.animate([{ opacity: .7 }, { opacity: 1 }], { duration: 120, fill: 'forwards' });
        return;
      }
      el.animate(
        [{ transform: 'scale(.97)' }, { transform: 'scale(1)' }],
        { duration: 220, easing: BACK, fill: 'forwards' }
      );
      return;
    }
    if (reduce()) {
      el.animate([{ opacity: .72 }, { opacity: 1 }], { duration: 120, fill: 'forwards' });
      return;
    }
    el.animate(
      [
        { transform: 'scale(0.96, 0.92)' },
        { transform: 'scale(1, 1.04)', offset: .42 },
        { transform: 'scale(1, 0.99)', offset: .72 },
        { transform: 'scale(1, 1)' }
      ],
      { duration: 260, easing: BACK, fill: 'forwards' }
    );
  }

  function init() {
    syncRoot();
    document.addEventListener('pointerdown', function (e) {
      const el = e.target.closest && e.target.closest('button, a.tab, .pressable');
      if (el) pressDown(el);

  function fade(el, from, to, ms) {
    return el.animate([{ opacity: from }, { opacity: to }], { duration: ms || 120, fill: 'forwards' }).finished;
  }

  function enter(el) {
    if (reduce()) return fade(el, 0, 1, 120);
    return el.animate(
      [{ transform: 'translateX(24px)', opacity: 0 }, { transform: 'translateX(0)', opacity: 1 }],
      { duration: 300, easing: OUT, fill: 'forwards' }
    ).finished;
  }

  function leave(el) {
    if (reduce()) return fade(el, 1, 0, 120);
    return el.animate(
      [{ transform: 'translateX(0)', opacity: 1 }, { transform: 'translateX(-12px)', opacity: 0 }],
      { duration: 180, easing: IN, fill: 'forwards' }
    ).finished;
  }

  function stagger(els, opts) {
    const list = Array.prototype.slice.call(els || []);
    const dur = (opts && opts.duration) || 360;
    const gap = (opts && opts.gap) || 60;
    const dy = (opts && opts.dy) || 16;
    list.forEach(function (el, i) {
      if (reduce()) {
        el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 120, fill: 'forwards' });
        return;
      }
      el.animate(
        [{ transform: 'translateY(' + dy + 'px)', opacity: 0 }, { transform: 'translateY(0)', opacity: 1 }],
        { duration: dur, delay: i * gap, easing: OUT, fill: 'forwards' }
      );
    });
  }

  function shake(el) {
    if (!el) return;
    if (reduce()) {
      el.animate([{ opacity: 1 }, { opacity: .45 }, { opacity: 1 }], { duration: 120 });
      return;
    }
    el.animate(
      [
        { transform: 'translateX(0)', offset: 0 },
        { transform: 'translateX(-6px)', offset: .2 },
        { transform: 'translateX(6px)', offset: .4 },
        { transform: 'translateX(-4px)', offset: .6 },
        { transform: 'translateX(4px)', offset: .8 },
        { transform: 'translateX(0)', offset: 1 }
      ],
      { duration: 380, easing: 'linear' }
    );
  }

  function pop(el) {
    if (!el) return;
    if (reduce()) {
      el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 120, fill: 'forwards' });
      return;
    }
    el.animate(
      [
        { transform: 'scale(0) rotate(-30deg)', opacity: 0 },
        { transform: 'scale(1.25) rotate(0deg)', opacity: 1, offset: .7 },
        { transform: 'scale(1) rotate(0deg)', opacity: 1 }
      ],
      { duration: 420, easing: BACK, fill: 'forwards' }
    );
  }

  function bounce(el) {
    if (!el) return;
    if (reduce()) {
      el.animate([{ opacity: .65 }, { opacity: 1 }], { duration: 120 });
      return;
    }
    el.animate(
      [
        { transform: 'translateY(0) scaleY(1)' },
        { transform: 'translateY(-6px) scaleY(1.03)', offset: .45 },
        { transform: 'translateY(0) scaleY(1)' }
      ],
      { duration: 320, easing: BACK }
    );
  }

  function arcFly(fromEl, toEl, opts) {
    opts = opts || {};
    if (!fromEl || !toEl) return Promise.resolve();
    const a = fromEl.getBoundingClientRect();
    const b = toEl.getBoundingClientRect();
    const x0 = a.left + a.width / 2;
    const y0 = a.top + a.height / 2;
    const x1 = b.left + b.width / 2;
    const y1 = b.top + b.height / 2;
    const cx = (x0 + x1) / 2;
    const cy = (y0 + y1) / 2 - (opts.lift == null ? 120 : opts.lift);
    const owned = !opts.flyer;
    const flyer = opts.flyer || document.createElement('div');
    if (owned) {
      flyer.className = 'fly-star';
      flyer.textContent = opts.text || '★';
      document.body.appendChild(flyer);
    }
    const dur = opts.duration || 560;
    const scaleFrom = opts.scaleFrom == null ? 1 : opts.scaleFrom;
    const scaleTo = opts.scaleTo == null ? 0.6 : opts.scaleTo;
    if (reduce()) {
      flyer.style.transform = 'translate(' + x0 + 'px,' + y0 + 'px) translate(-50%,-50%)';
      return flyer.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 120 }).finished.then(function () {
        flyer.remove();
      });
    }
    flyer.style.transform = 'translate(' + x0 + 'px,' + y0 + 'px) translate(-50%,-50%) scale(' + scaleFrom + ')';
    const t0 = performance.now();
    const ease = LK.ease.inout;
    return new Promise(function (resolve) {
      function frame(now) {
        const t = Math.min(1, (now - t0) / dur);
        const e = ease(t);
        const x = (1 - e) * (1 - e) * x0 + 2 * (1 - e) * e * cx + e * e * x1;
        const y = (1 - e) * (1 - e) * y0 + 2 * (1 - e) * e * cy + e * e * y1;
        const rot = (opts.rotate == null ? 200 : opts.rotate) * e;
        const sc = scaleFrom + (scaleTo - scaleFrom) * e;
        flyer.style.transform = 'translate(' + x + 'px,' + y + 'px) translate(-50%,-50%) rotate(' + rot + 'deg) scale(' + sc + ')';
        if (t < 1) requestAnimationFrame(frame);
        else { flyer.remove(); resolve(); }

      requestAnimationFrame(frame);
    });
  }

  function confetti(originEl) {
    if (reduce() || !originEl) return;
    const r = originEl.getBoundingClientRect();
    const x = r.left + r.width / 2;
    const y = r.top + r.height * 0.35;
    const colors = ['#E46A9C', '#C8664A', '#2F9E8F', '#D99A2B', '#7C6BD6', '#3D86D9', '#F2B640', '#E0795B'];
    const n = 8 + Math.floor(Math.random() * 5);
    for (let i = 0; i < n; i++) {
      const p = document.createElement('i');
      p.className = 'confetti-bit';
      p.style.background = colors[i % colors.length];
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      document.body.appendChild(p);
      const ang = -Math.PI * (0.2 + Math.random() * 0.7);
      const dir = i % 2 === 0 ? 1 : -1;
      const sp = 220 + Math.random() * 380;
      const vx = Math.cos(ang) * sp * dir * (0.45 + Math.random());
      const vy = -(240 + Math.random() * 420);
      const g = 980;
      const rot = Math.random() * 640 - 320;
      const t0 = performance.now();
      (function tick(now) {
        const sec = (now - t0) / 1000;
        const k = Math.min(1, (now - t0) / 1200);
        p.style.transform = 'translate(' + (vx * sec) + 'px,' + (vy * sec + 0.5 * g * sec * sec) + 'px) rotate(' + (rot * k) + 'deg)';

  function flip(el, swap) {

        return fade(el, 0, 1, 120);

    }
    return el.animate(
      [{ transform: 'perspective(900px) rotateY(0deg) scale(1)' }, { transform: 'perspective(900px) rotateY(-6deg) scale(.98)' }],
      { duration: 120, easing: ANTICIP, fill: 'forwards' }
    ).finished.then(function () {
      return el.animate(
        [{ transform: 'perspective(900px) rotateY(-6deg) scale(.98)' }, { transform: 'perspective(900px) rotateY(90deg) scale(.98)' }],

      swap();
      return el.animate(
        [{ transform: 'perspective(900px) rotateY(-90deg) scale(1)' }, { transform: 'perspective(900px) rotateY(0deg) scale(1)' }],

  }

  function stepIn(el) {
    if (!el) return;
    const bar = el.querySelector('.step-bar');
    if (reduce()) {
      el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 120, fill: 'forwards' });
      return;
    }
    el.animate(
      [
        { transform: 'translateY(10px) scale(.98)', opacity: 0 },
        { transform: 'translateY(0) scale(1)', opacity: 1 }
      ],
      { duration: 280, easing: OUT, fill: 'forwards' }
    );
    if (bar) {
      bar.animate(
        [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }],
        { duration: 240, delay: 80, easing: OUT, fill: 'forwards' }
      );
    }
  }

  function dim(el) {
    if (!el) return;
    el.classList.add('step-past');
  }

  function growX(el) {
    if (!el) return;
    el.style.transformOrigin = 'left center';
    if (reduce()) {
      el.style.transform = 'scaleX(1)';
      return;
    }
    el.animate(
      [{ transform: 'scaleX(0)' }, { transform: 'scaleX(1)' }],
      { duration: 300, delay: 80, easing: OUT, fill: 'forwards' }
    );
  }

  function revealRows(panel, opts) {
    opts = opts || {};
    if (!panel) return;
    const dur = opts.duration || 360;
    const delay = opts.delay || 0;
    function run() {
      panel.hidden = false;
      if (reduce()) {
        panel.style.gridTemplateRows = '1fr';
        panel.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 120, fill: 'forwards' });
        return;
      }
      panel.animate(
        [{ gridTemplateRows: '0fr' }, { gridTemplateRows: '1fr' }],
        { duration: dur, easing: OUT, fill: 'forwards' }
      );
    }
    if (delay) setTimeout(run, delay);
    else run();
  }

  function pinDrop(el) {
    if (!el) return;
    if (reduce()) {
      el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 120, fill: 'forwards' });
      return;
    }
    el.animate(
      [
        { transform: 'translateY(-40px) scale(1, 1)', opacity: 0 },
        { transform: 'translateY(0) scale(1.2, .7)', opacity: 1, offset: .72 },
        { transform: 'translateY(0) scale(1, 1)', opacity: 1 }
      ],
      { duration: 440, easing: BACK, fill: 'forwards' }
    );
    const ripple = el.querySelector('.ripple');
    if (ripple) {
      ripple.animate(
        [{ transform: 'scale(.4)', opacity: .5 }, { transform: 'scale(1.6)', opacity: 0 }],
        { duration: 600, easing: OUT, fill: 'forwards' }
      );
    }
  }

  function lightTile(tile, neighbors) {
    if (!tile) return;
    const veil = tile.querySelector('.tile-veil');
    if (veil) {
      veil.animate([{ opacity: 0 }, { opacity: 1 }], { duration: reduce() ? 120 : 240, easing: OUT, fill: 'forwards' });
    }
    tile.classList.add('is-lit');
    if (reduce()) return;
    tile.animate(
      [{ transform: 'scale(1)' }, { transform: 'scale(1.12)', offset: .55 }, { transform: 'scale(1)' }],
      { duration: 300, easing: BACK }
    );
    (neighbors || []).forEach(function (n, i) {
      n.animate(
        [{ transform: 'scale(1)' }, { transform: 'scale(1.04)', offset: .5 }, { transform: 'scale(1)' }],
        { duration: 220, delay: 40 * (i + 1), easing: OUT }
      );
    });
  }

  function flipNum(el, text) {
    if (!el) return;
    if (reduce()) { el.textContent = text; return; }
    el.animate(
      [
        { transform: 'translateY(0)', opacity: 1 },
        { transform: 'translateY(-80%)', opacity: 0, offset: .45 },
        { transform: 'translateY(60%)', opacity: 0, offset: .55 },
        { transform: 'translateY(0)', opacity: 1 }
      ],
      { duration: 320, easing: BACK }
    );
    setTimeout(function () { el.textContent = text; }, 140);
  }

  function celebrateMascot(svg) {
    if (!svg) return;
    const body = svg.querySelector('.mascot-bob');
    const flag = svg.querySelector('.note-flag');
    if (!body) return;
    body.classList.add('no-bob');
    if (reduce()) {
      body.animate([{ opacity: .55 }, { opacity: 1 }], { duration: 120 });
      setTimeout(function () { body.classList.remove('no-bob'); }, 140);
      return;
    }
    body.animate(
      [
        { transform: 'translateY(0) scale(1, 1)', offset: 0 },
        { transform: 'translateY(2px) scale(1.06, .9)', offset: 100 / 520 },
        { transform: 'translateY(-14px) scale(.96, 1.08)', offset: 280 / 520 },
        { transform: 'translateY(0) scale(1.04, .92)', offset: 420 / 520 },
        { transform: 'translateY(0) scale(1, 1)', offset: 1 }
      ],
      { duration: 520, easing: BACK }
    );
    if (flag) {
      flag.animate(
        [
          { transform: 'rotate(0deg)', offset: 0 },
          { transform: 'rotate(-16deg)', offset: .55 },
          { transform: 'rotate(6deg)', offset: .82 },
          { transform: 'rotate(0deg)', offset: 1 }
        ],
        { duration: 580, delay: 60, easing: OUT }
      );
    }
    setTimeout(function () { body.classList.remove('no-bob'); }, 700);
  }

  async function playChest(chest, lid, spawnCard) {
    if (!chest || !lid) { if (spawnCard) spawnCard(); return; }
    if (reduce()) {
      lid.style.transform = 'perspective(600px) rotateX(70deg) translateY(-6px)';
      if (spawnCard) spawnCard();
      return;
    }
    await chest.animate(
      [
        { transform: 'rotate(0deg)' },
        { transform: 'rotate(-4deg)', offset: .25 },
        { transform: 'rotate(4deg)', offset: .5 },
        { transform: 'rotate(-4deg)', offset: .75 },
        { transform: 'rotate(0deg)' }
      ],
      { duration: 300, easing: 'linear' }
    ).finished;
    const lidAnim = lid.animate(
      [
        { transform: 'perspective(600px) rotateX(0deg) translateY(0px)' },
        { transform: 'perspective(600px) rotateX(78deg) translateY(-10px)', offset: .72 },
        { transform: 'perspective(600px) rotateX(70deg) translateY(-6px)' }
      ],
      { duration: 420, easing: BACK, fill: 'forwards' }
    );
    confetti(chest);
    await LK.wait(300);
    if (spawnCard) spawnCard();
    try { await lidAnim.finished; } catch (e) {}
  }

  global.LKMotion = {
    init: init,
    reduce: reduce,
    syncRoot: syncRoot,
    enter: enter,
    leave: leave,
    stagger: stagger,
    shake: shake,
    pop: pop,
    bounce: bounce,
    arcFly: arcFly,
    confetti: confetti,
    flip: flip,
    stepIn: stepIn,
    dim: dim,
    growX: growX,
    revealRows: revealRows,
    pinDrop: pinDrop,
    lightTile: lightTile,
    flipNum: flipNum,
    celebrateMascot: celebrateMascot,
    playChest: playChest
  };
})(window);

  <script>
/* js/store.js */
(function (global) {
  const KEY = 'liuke.v2';
  const INTERVALS = [1, 3, 7, 21];
  let state = null;
  let streakBumped = false;

  function blank() {
    const today = LK.todayStr();
    return {
      version: 2,
      currentDay: 1,
      lastOpenDate: today,
      dayCompletedDate: {},
      clearedOn: {},
      lessons: {},
      mistakes: {},
      mastered: [],
      cards: [],
      pins: [],
      places: [],
      xp: 0,
      streak: { count: 0, lastDate: null, freezeLeft: 2, freezeMonth: today.slice(0, 7) },
      badges: [],
      settings: { reduceMotion: false, ttsRate: 0.9, miniDefault: false, debug: false },
      miniOn: false,
      welcomeBack: false,
      notice: null,
      draft: null,
      seed: Math.floor(Math.random() * 1e9)
    };
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) { state = blank(); return; }
      const parsed = JSON.parse(raw);
      const b = blank();
      state = Object.assign(b, parsed);
      state.streak = Object.assign(b.streak, parsed.streak || {});
      state.settings = Object.assign(b.settings, parsed.settings || {});
      state.lessons = parsed.lessons || {};
      state.mistakes = parsed.mistakes || {};
      state.mastered = parsed.mastered || [];
      state.cards = parsed.cards || [];
      state.pins = parsed.pins || [];
      state.places = parsed.places || [];
      state.badges = parsed.badges || [];
      state.dayCompletedDate = parsed.dayCompletedDate || {};
      state.clearedOn = parsed.clearedOn || {};
      if (!state.seed) state.seed = Math.floor(Math.random() * 1e9);
    } catch (e) {
      state = blank();
    }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function waitingForChest(today) {
    const key = String(state.currentDay);
    const cleared = state.clearedOn[key];
    const chest = state.dayCompletedDate[key];
    return !!(cleared && cleared < today && !chest);
  }

  function reconcile() {
    const today = LK.todayStr();
    const month = today.slice(0, 7);
    if (state.streak.freezeMonth !== month) {
      state.streak.freezeLeft = 2;
      state.streak.freezeMonth = month;
    }
    const key = String(state.currentDay);
    const chest = state.dayCompletedDate[key];
    if (chest && chest < today && state.currentDay < 14) state.currentDay += 1;
    const idle = waitingForChest(today);
    if (state.streak.lastDate && state.streak.lastDate < today && !idle) {
      const missed = LK.missedDayList(state.streak.lastDate, today);
      if (missed.length === 1 && state.streak.freezeLeft > 0) {
        state.streak.freezeLeft -= 1;
        state.streak.lastDate = missed[0];
        state.notice = 'freeze';
      } else if (missed.length >= 1) {
        state.streak.count = 0;
        state.streak.lastDate = null;
        state.welcomeBack = true;
      }
    }
    state.lastOpenDate = today;
  }

  function bumpStreak(today) {
    if (state.streak.lastDate === today) return;
    const prev = state.streak.lastDate;
    const before = state.streak.count;
    if (!prev) state.streak.count = 1;
    else if (LK.missedDayList(prev, today).length === 0) state.streak.count += 1;
    else state.streak.count = 1;
    state.streak.lastDate = today;
    if (state.streak.count > before) streakBumped = true;
  }

  function sixIds(day) {
    return global.SUBJECT_ORDER.map(function (s) { return LK.lessonId(day, s); });
  }

  function maybeClear(day) {
    const ids = sixIds(day);
    if (!ids.every(function (id) { return !!state.lessons[id]; })) return;
    const key = String(day);
    if (!state.clearedOn[key]) {
      state.clearedOn[key] = LK.todayStr();
      bumpStreak(state.clearedOn[key]);
    }
  }

  function init() {
    load();
    reconcile();
    save();
    return state;
  }

  function grade(key, ok, wrongOriginal) {
    if (!key) return;
    if (!ok) {
      state.mistakes[key] = {
        due: state.currentDay + INTERVALS[0],
        stage: 0,
        wrongPick: wrongOriginal
      };
      state.mastered = state.mastered.filter(function (k) { return k !== key; });
    } else if (state.mistakes[key]) {
      const cur = state.mistakes[key];
      const next = cur.stage + 1;
      if (next >= INTERVALS.length) {
        delete state.mistakes[key];
        if (state.mastered.indexOf(key) < 0) state.mastered.push(key);
      } else {
        state.mistakes[key] = {
          due: state.currentDay + INTERVALS[next],
          stage: next,
          wrongPick: cur.wrongPick
        };
      }
    }
    save();
  }

  function completeLesson(p) {
    const prev = state.lessons[p.id];
    const first = !prev;
    if (first) {
      state.xp += 10 + p.stars * 5 + (p.bossPerfect ? 20 : 0);
      if (!p.isBoss && state.cards.indexOf(p.id) < 0) state.cards.push(p.id);
      (p.pinIds || []).forEach(function (id) {
        if (state.pins.indexOf(id) < 0) state.pins.push(id);
      });
      (p.placeIds || []).forEach(function (id) {
        if (state.places.indexOf(id) < 0) state.places.push(id);
      });
    }
    (p.badges || []).forEach(function (b) {
      if (p.bossPerfect && state.badges.indexOf(b) < 0) state.badges.push(b);
    });
    state.lessons[p.id] = {
      stars: p.stars,
      best: Math.max(prev ? (prev.best || 0) : 0, p.stars),
      doneAt: prev ? prev.doneAt : Date.now(),
      ms: p.ms,
      mini: !!p.mini,
      correct: p.correct,
      total: p.total
    };
    if (!p.isBoss) maybeClear(p.day);
    state.draft = null;
    state.welcomeBack = false;
    save();
    return { first: first };
  }

  function openChest(day) {
    const key = String(day);
    const first = !state.dayCompletedDate[key];
    if (first) {
      state.dayCompletedDate[key] = LK.todayStr();
      state.xp += 30;
    }
    save();
    return first;
  }

  function reset() {
    localStorage.removeItem(KEY);
    state = blank();
    reconcile();
    save();
  }

  global.LKStore = {
    init: init,
    get: function () { return state; },
    save: save,
    grade: grade,
    completeLesson: completeLesson,
    openChest: openChest,
    reset: reset,
    consumeNotice: function () {
      const n = state.notice;
      if (n) { state.notice = null; save(); }
      return n;
    },
    consumeStreakBump: function () {
      const b = streakBumped;
      streakBumped = false;
      return b;
    },
    setDraft: function (draft) { state.draft = draft; save(); },
    clearDraft: function () { state.draft = null; save(); },
    setMini: function (on) { state.miniOn = !!on; save(); },
    setSetting: function (k, v) {
      state.settings[k] = v;
      if (k === 'miniDefault') state.miniOn = !!v;
      save();
      if (global.LKMotion) LKMotion.syncRoot();
    },
    jumpDay: function (n) {
      n = Math.max(1, Math.min(14, n | 0));
      state.currentDay = n;
      state.welcomeBack = false;
      save();
    },
    clearWelcome: function () {
      if (!state.welcomeBack) return;
      state.welcomeBack = false;
      save();
    },
    INTERVALS: INTERVALS
  };
})(window);

  <script>
/* js/catalog.js */
(function (global) {
  function dayObj(n) {
    return (global.DAYS || []).find(function (d) { return d.day === n; }) || null;
  }

  function rawLesson(day, subject) {
    const d = dayObj(day);
    if (!d || d.type !== 'new' || !d.lessons) return null;
    return d.lessons[subject] || null;
  }

  function buildReview(day, subject) {
    const week = day === 7 ? [1, 2, 3, 4, 5, 6] : [8, 9, 10, 11, 12, 13];
    const takes = [];
    week.forEach(function (n) {
      const les = rawLesson(n, subject);
      if (les) takes.push(les.take);
    });
    const sub = SUBJECTS[subject];
    return {
      id: LK.lessonId(day, subject),
      title: sub.name + '回炉',
      minutes: 3,
      review: true,
      day: day,
      subject: subject,
      week: week,
      takes: takes,
      hook: '先把本周带走的 6 句话看一遍，再做 3 道题。',
      take: '本周' + sub.name + '，把这 6 句再带走一次。'
    };
  }

  function lesson(day, subject) {
    const d = dayObj(day);
    if (!d) return null;
    if (subject === 'boss') {
      if (!d.boss) return null;
      return {
        id: LK.lessonId(day, 'boss'),
        title: d.boss.title,
        minutes: 4,
        boss: true,
        day: day,
        subject: 'boss',
        intro: d.boss.intro,
        parts: d.boss.parts
      };
    }
    if (d.type === 'review') return buildReview(day, subject);
    const les = rawLesson(day, subject);
    if (!les) return null;
    return Object.assign({ day: day, subject: subject }, les);
  }

  function findQuestion(key) {
    const m = /^d(\d+)-([a-z]+)#(\d+)$/.exec(key || '');
    if (!m) return null;
    const day = +m[1];
    const subject = m[2];
    const idx = +m[3];
    const d = dayObj(day);
    let q = null;
    if (subject === 'boss' && d && d.boss) q = d.boss.parts[idx];
    else if (d && d.type === 'new' && d.lessons[subject]) q = d.lessons[subject].quiz[idx];
    if (!q) return null;
    return {
      key: key,
      q: q.q,
      options: q.options.slice(),
      answer: q.answer,
      why: q.why
    };
  }

  function present(q, salt) {
    const map = LK.shuffleIdx(q.options.length, (q.key || q.q) + '|' + salt);
    return {
      key: q.key,
      q: q.q,
      why: q.why,
      review: !!q.review,
      options: map.map(function (i) { return q.options[i]; }),
      answer: map.indexOf(q.answer),
      indexMap: map
    };
  }

  function questionPool(subject, days) {
    const pool = [];
    days.forEach(function (n) {
      const les = rawLesson(n, subject);
      if (!les) return;
      les.quiz.forEach(function (q, i) {
        pool.push({
          key: les.id + '#' + i,
          q: q.q,
          options: q.options.slice(),
          answer: q.answer,
          why: q.why,
          review: true
        });
      });
    });
    return pool;
  }

  function pickReviewSet(subject, day) {
    const state = LKStore.get();
    const days = day === 7 ? [1, 2, 3, 4, 5, 6] : [8, 9, 10, 11, 12, 13];
    const pool = questionPool(subject, days);
    if (day === 14) {
      Object.keys(state.mistakes).forEach(function (key) {
        if (key.indexOf('-' + subject + '#') < 0) return;
        const dayNum = +key.slice(1, 3);
        if (dayNum < 1 || dayNum > 6) return;
        if (pool.some(function (p) { return p.key === key; })) return;
        const q = findQuestion(key);
        if (q) pool.push(Object.assign({ review: true }, q));
      });
    }
    const missed = pool.filter(function (p) { return !!state.mistakes[p.key]; });
    missed.sort(function (a, b) { return state.mistakes[a.key].due - state.mistakes[b.key].due; });
    const rest = pool.filter(function (p) { return !state.mistakes[p.key]; });
    rest.sort(function (a, b) {
      return LK.hashStr(a.key + '|rev|' + day) - LK.hashStr(b.key + '|rev|' + day);
    });
    return missed.concat(rest).slice(0, 3);
  }

  function pickOneReview(subject, day, lessonKey) {
    if (day <= 1) return null;
    const state = LKStore.get();
    const due = Object.keys(state.mistakes).filter(function (k) {
      return k.indexOf('-' + subject + '#') >= 0 && state.mistakes[k].due <= day;
    }).sort(function (a, b) {
      return state.mistakes[a].due - state.mistakes[b].due || (a < b ? -1 : 1);
    });
    if (due.length) {
      const q = findQuestion(due[0]);
      if (q) return Object.assign({ review: true }, q);
    }
    const pool = [];
    for (let d = 1; d < day; d++) {
      if (d === 7 || d === 14) continue;
      const id = LK.lessonId(d, subject);
      if (!state.lessons[id]) continue;
      const les = rawLesson(d, subject);
      if (!les) continue;
      les.quiz.forEach(function (q, i) {
        pool.push({
          key: id + '#' + i,
          q: q.q,
          options: q.options.slice(),
          answer: q.answer,
          why: q.why,
          review: true
        });
      });
    }
    if (!pool.length) return null;
    const idx = LK.hashStr(lessonKey + '|' + state.seed) % pool.length;
    return pool[idx];
  }

  function buildQuiz(les, mini) {
    const salt = LKStore.get().seed;
    if (les.boss) {
      return les.parts.map(function (q, i) {
        return present({
          key: les.id + '#' + i,
          q: q.q,
          options: q.options,
          answer: q.answer,
          why: q.why
        }, salt);
      });
    }
    if (les.review) {
      let set = pickReviewSet(les.subject, les.day);
      if (mini) set = set.slice(0, 1);
      return set.map(function (q) { return present(q, salt); });
    }
    const base = les.quiz.map(function (q, i) {
      return {
        key: les.id + '#' + i,
        q: q.q,
        options: q.options.slice(),
        answer: q.answer,
        why: q.why
      };
    });
    let list = mini ? base.slice(0, 1) : base.slice();
    if (!mini && les.day > 1) {
      const extra = pickOneReview(les.subject, les.day, les.id);
      if (extra) list.push(extra);
    }
    return list.map(function (q) { return present(q, salt); });
  }

  function starsFor(wrongs) {
    if (wrongs <= 0) return 3;
    if (wrongs === 1) return 2;
    return 1;
  }

  function sixDone(day) {
    const st = LKStore.get();
    return SUBJECT_ORDER.every(function (s) { return !!st.lessons[LK.lessonId(day, s)]; });
  }

  function doneCount(day) {
    const st = LKStore.get();
    return SUBJECT_ORDER.filter(function (s) { return !!st.lessons[LK.lessonId(day, s)]; }).length;
  }

  function nextOpen(day, current) {
    const st = LKStore.get();
    const start = current === 'boss' ? -1 : SUBJECT_ORDER.indexOf(current);
    for (let step = 1; step <= SUBJECT_ORDER.length; step++) {
      const s = SUBJECT_ORDER[(start + step) % SUBJECT_ORDER.length];
      if (!st.lessons[LK.lessonId(day, s)]) return s;
    }
    return null;
  }

  function weekNo(day) { return day <= 7 ? 1 : 2; }

  function seasonLabel(day) {
    return '第 ' + day + ' 天 · 第 1 季 第 ' + weekNo(day) + ' 周';
  }

  function bubble(state) {
    const day = state.currentDay;
    const d = dayObj(day);
    if (state.welcomeBack) return '欢迎回来，从第 ' + day + ' 天接着来，没有欠账。';
    const n = doneCount(day);
    const chest = !!state.dayCompletedDate[String(day)];
    if (n === 0) {
      if (d && d.type === 'review') return '今天是周复盘。先从时尚回炉热个身？';
      if (state.miniOn) return '迷你模式 6 关，约 8 分钟。先从时尚热个身？';
      return '今天 6 关，约 30 分钟。先从时尚热个身？';
    }
    if (n <= 2) {
      const next = SUBJECT_ORDER.find(function (s) { return !state.lessons[LK.lessonId(day, s)]; });
      return '不错！下一关推荐：' + SUBJECTS[next].name + '。';
    }
    if (n <= 5) return '过半啦，还剩 ' + (6 - n) + ' 关。';
    if (!chest) return '六连达成！宝箱在等你。';
    return '今天收工。明天见～';
  }

  function provinceById(id) {
    return PROVINCES.find(function (p) { return p.id === id; }) || null;
  }

  function terrainLevel(id) {
    if (MAP_META.level1.indexOf(id) >= 0) return 1;
    if (MAP_META.level2.indexOf(id) >= 0) return 2;
    return 3;
  }

  function placeId(p) { return p.layer + ':' + p.id; }

  function learnedProvince(id) {
    const places = LKStore.get().places;
    return places.some(function (k) { return k.split(':')[1] === id && k.indexOf('river:') !== 0; })
      || places.indexOf('province:' + id) >= 0
      || places.indexOf('terrain:' + id) >= 0;
  }

  function knowledgeFor(provId) {
    const lines = [];
    const st = LKStore.get();
    (DAYS || []).forEach(function (d) {
      if (d.type !== 'new') return;
      SUBJECT_ORDER.forEach(function (s) {
        const les = d.lessons[s];
        if (!les || !les.places) return;
        if (!les.places.some(function (p) { return p.id === provId; })) return;
        if (!st.lessons[les.id]) return;
        lines.push({ subject: s, day: d.day, text: les.take });
      });
    });
    return lines;
  }

  function dynastyLearned(name) {
    const pins = LKStore.get().pins;
    for (let i = 0; i < DAYS.length; i++) {
      const d = DAYS[i];
      if (d.type !== 'new') continue;
      const les = d.lessons.history;
      if (!les || !les.pins) continue;
      for (let k = 0; k < les.pins.length; k++) {
        const pin = les.pins[k];
        if (pin.kind === 'dynasty' && pin.label === name && pins.indexOf(les.id + '#' + k) >= 0) return les;
      }
    }
    return null;
  }

  function pinLesson(pinId) {
    const id = pinId.split('#')[0];
    const m = /^d(\d+)-([a-z]+)$/.exec(id);
    if (!m) return null;
    return lesson(+m[1], m[2]);
  }

  global.LKCatalog = {
    dayObj: dayObj,
    rawLesson: rawLesson,
    lesson: lesson,
    findQuestion: findQuestion,
    present: present,
    buildQuiz: buildQuiz,
    starsFor: starsFor,
    sixDone: sixDone,
    doneCount: doneCount,
    nextOpen: nextOpen,
    weekNo: weekNo,
    seasonLabel: seasonLabel,
    bubble: bubble,
    provinceById: provinceById,
    terrainLevel: terrainLevel,
    placeId: placeId,
    learnedProvince: learnedProvince,
    knowledgeFor: knowledgeFor,
    dynastyLearned: dynastyLearned,
    pinLesson: pinLesson
  };
})(window);

/* js/widgets/visuals.js */
(function (global) {
  function swatches(v) {
    const row = LK.h('div', { class: 'viz viz-swatches' });
    (v.colors || []).forEach(function (c, i) {
      const item = LK.h('div', { class: 'viz-swatch' }, [
        LK.h('i', { style: { background: c } }),
        v.labels && v.labels[i] ? LK.h('span', { text: v.labels[i] }) : null
      ]);
      row.appendChild(item);
    });
    return row;
  }

  function bars(v) {
    const items = v.items || [];
    const max = Math.max.apply(null, items.map(function (it) { return Math.abs(it.value); }).concat([1]));
    const box = LK.h('div', { class: 'viz viz-bars' });
    items.forEach(function (it) {
      const neg = it.value < 0;
      const row = LK.h('div', { class: 'viz-bar-row' }, [
        LK.h('span', { class: 'viz-bar-label', text: it.label }),
        LK.h('span', { class: 'viz-bar-track' }, [
          LK.h('i', {
            class: 'viz-bar-fill' + (neg ? ' is-neg' : ''),
            style: {
              width: Math.max(6, Math.round(Math.abs(it.value) / max * 100)) + '%',
              background: it.color || (neg ? 'var(--bad)' : 'var(--accent)')
            }
          })
        ]),
        LK.h('span', { class: 'num viz-bar-val', text: (it.value > 0 ? '+' : '') + it.value + (v.unit || '') })
      ]);
      box.appendChild(row);
    });
    return box;
  }

  function ladder(v) {
    const box = LK.h('div', { class: 'viz viz-ladder' });
    const heights = ['100%', '68%', '40%'];
    (v.steps || []).forEach(function (s, i) {
      box.appendChild(LK.h('div', { class: 'viz-ladder-step', style: { height: heights[i] || '40%' } }, [
        LK.h('b', { text: s.label }),
        LK.h('span', { text: s.sub || '' })
      ]));
    });
    return box;
  }

  function flow(v) {
    const box = LK.h('div', { class: 'viz viz-flow' });
    (v.nodes || []).forEach(function (n, i) {

(function (global) {

    const root = host();
    const mask = LK.h('div', { class: 'mask' });

    const grip = LK.h('div', { class: 'sheet-grip' });
    const body = LK.h('div', { class: 'sheet-body' });
    sheet.appendChild(grip);
    sheet.appendChild(body);
    root.appendChild(mask);
    root.appendChild(sheet);
    let closed = false;
    function close() {
      if (closed) return;
      closed = true;
      const done = function () { mask.remove(); sheet.remove(); };
      if (LKMotion.reduce()) {
        mask.animate([{ opacity: .35 }, { opacity: 0 }], { duration: 120, fill: 'forwards' });
        sheet.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 120, fill: 'forwards' }).finished.then(done);
        return;
      }
      mask.animate([{ opacity: .35 }, { opacity: 0 }], { duration: 180, easing: 'cubic-bezier(.55,0,1,.45)', fill: 'forwards' });
      sheet.animate(
        [{ transform: 'translateY(0)' }, { transform: 'translateY(100%)' }],
        { duration: 180, easing: 'cubic-bezier(.55,0,1,.45)', fill: 'forwards' }
      ).finished.then(done);
    }
    build(body, close);
    if (LKMotion.reduce()) {
      mask.animate([{ opacity: 0 }, { opacity: .35 }], { duration: 120, fill: 'forwards' });
      sheet.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 120, fill: 'forwards' });
    } else {
      mask.animate([{ opacity: 0 }, { opacity: .35 }], { duration: 240, fill: 'forwards' });
      sheet.animate(
        [
          { transform: 'translateY(100%)' },
          { transform: 'translateY(-6px)', offset: .86 },
          { transform: 'translateY(0)' }
        ],
        { duration: 380, easing: 'cubic-bezier(.22,1,.36,1)', fill: 'forwards' }
      );
    }
    mask.addEventListener('click', close);
    return close;
  }

  function confirm(opts) {
    return new Promise(function (resolve) {
      open(function (body, close) {
        body.appendChild(LK.h('h2', { class: 'sheet-title', text: opts.title }));
        if (opts.body) body.appendChild(LK.h('p', { class: 'sheet-copy', text: opts.body }));
        const row = LK.h('div', { class: 'sheet-actions' });
        row.appendChild(LK.h('button', {
          class: 'btn btn-secondary',
          text: opts.cancel || '取消',
          onClick: function () { resolve(false); close(); }
        }));
        row.appendChild(LK.h('button', {
          class: 'btn btn-primary',
          text: opts.ok || '确定',
          onClick: function () { resolve(true); close(); }

        body.appendChild(row);

(function (global) {
  function finishOnce(ctx) {

  function fmtFactor(n) {
    const r = Math.round(n * 10000) / 10000;
    return String(r);
  }

  function powSeq(factor, times, op) {
    const n = Math.max(0, Math.round(times));
    if (n <= 0) return '1';
    if (n <= 6) {
      const bits = [];
      for (let i = 0; i < n; i++) bits.push(factor);
      return bits.join(op);
    }
    return factor + ' ' + op.trim() + ' …（共 ' + n + ' 次）';
  }

  function stripOuter(s) {
    s = s.trim();
    if (s.charAt(0) !== '(' || s.charAt(s.length - 1) !== ')') return s;
    let depth = 0;
    for (let i = 0; i < s.length; i++) {
      if (s.charAt(i) === '(') depth++;
      else if (s.charAt(i) === ')') depth--;
      if (depth === 0 && i < s.length - 1) return s;
    }
    return s.slice(1, -1).trim();
  }

  function prettyExpr(expr, vars, display) {
    if (display) {
      let shown = String(display);
      const keys = Object.keys(vars).sort(function (a, b) { return b.length - a.length; });
      keys.forEach(function (k) {
        shown = shown.replace(new RegExp('\\{' + k + '\\}', 'g'), String(vars[k]));
      });
      return shown.trim();
    }
    let shown = String(expr).replace(/\.toFixed\(\d+\)/g, '');
    const divRe = /(\w+)\s*\/\s*Math\.pow\(\s*1\s*\+\s*(\w+)\s*\/\s*100\s*,\s*(\w+)\s*\)/;
    const div = divRe.exec(shown);
    if (div) {
      const factor = fmtFactor(1 + Number(vars[div[2]]) / 100);
      const seq = powSeq(factor, Number(vars[div[3]]), ' ÷ ');
      shown = shown.replace(div[0], div[1] + ' ÷ ' + seq);
    }
    shown = shown.replace(/Math\.pow\(\s*1\s*\+\s*(\w+)\s*\/\s*100\s*,\s*(\w+)\s*\)/g, function (_, rKey, yKey) {
      const factor = fmtFactor(1 + Number(vars[rKey]) / 100);
      return powSeq(factor, Number(vars[yKey]), ' × ');

    const keys = Object.keys(vars).sort(function (a, b) { return b.length - a.length; });
    keys.forEach(function (k) {
      shown = shown.replace(new RegExp('\\b' + k + '\\b', 'g'), String(vars[k]));
    });

        if (selected === card) selected = null;
      }, 180);
    }

    function dropSelected(bi, binEl) {
      if (!selected) {
        status.textContent = '先点一张卡片。';
        return;
      }
      const item = selected._item;
      if (item.bin !== bi) {
        reject(selected, binEl);
        return;
      }
      binEl.appendChild(selected);
      succeed(selected);
    }

    order.forEach(function (i) {
      const item = inter.items[i];
      const card = cardEl(item, String(i));
      card._item = item;
      card.addEventListener('click', function () {
        if (card.classList.contains('is-in')) return;
        pool.querySelectorAll('.sort-card').forEach(function (c) { c.classList.remove('is-selected'); });
        card.classList.add('is-selected');
        selected = card;
      });
      let start = null;
      card.addEventListener('pointerdown', function (e) { start = { x: e.clientX, y: e.clientY, id: e.pointerId }; });
      card.addEventListener('pointerup', function (e) {
        if (!start) return;
        const dx = e.clientX - start.x;
        const dy = e.clientY - start.y;
        start = null;
        if (Math.hypot(dx, dy) < 12) return;
        const el = document.elementFromPoint(e.clientX, e.clientY);
        const bin = el && el.closest ? el.closest('.bin') : null;
        if (!bin) return;
        selected = card;
        dropSelected(+bin.dataset.bin, bin);
      });
      pool.appendChild(card);
    });

    root.appendChild(hint);
    root.appendChild(status);
    root.appendChild(pool);
    root.appendChild(bins);
    ctx.setAction({ hidden: true });
    return root;
  }

  function mountSlider(inter, ctx) {
    const root = LK.h('div', { class: 'inter' });
    root.appendChild(LK.h('p', { class: 'inter-prompt', text: inter.prompt || '拖动滑块，看数字怎么变。' }));
    const vars = {};
    let moved = false;
    const rows = LK.h('div', { class: 'slider-rows' });
    inter.vars.forEach(function (v) {
      vars[v.key] = v.value;
      const out = LK.h('span', { class: 'num slider-val', text: LK.fmtNum(v.value) + (v.unit || '') });
      const range = LK.h('input', {
        type: 'range',
        min: v.min,
        max: v.max,
        step: v.step,
        value: v.value,
        'aria-label': v.label
      });
      function paintRange() {
        const min = Number(range.min);
        const max = Number(range.max);
        const val = Number(range.value);
        const pct = max === min ? 0 : ((val - min) / (max - min)) * 100;
        range.style.setProperty('--fill', pct + '%');
      }
      paintRange();
      range.addEventListener('input', function () {
        moved = true;
        vars[v.key] = Number(range.value);
        out.textContent = LK.fmtNum(vars[v.key]) + (v.unit || '');
        paintRange();
        renderOut();
        ctx.setAction({ label: '我看明白了', disabled: false, onClick: finishOnce(ctx) });
      });
      rows.appendChild(LK.h('label', { class: 'slider-row' }, [
        LK.h('span', { class: 'slider-label' }, [document.createTextNode(v.label), out]),
        range
      ]));
    });
    const formulas = LK.h('div', { class: 'formula-stack' });
    function renderOut() {
      formulas.innerHTML = '';
      (inter.outputs || []).forEach(function (o) {
        let value = '';
        let shown = '';
        try {
          value = evalExpr(o.expr, vars);
          shown = prettyExpr(o.expr, vars, o.display) + ' = ' + (typeof value === 'string' ? value : LK.fmtNum(Number(value)));
          if (o.unit && String(shown).indexOf(o.unit) < 0) shown += ' ' + o.unit;
        } catch (e) {
          shown = '算式还不能算';
        }
        formulas.appendChild(LK.h('div', { class: 'formula' }, [
          LK.h('div', { class: 'formula-k', text: o.label }),
          LK.h('div', { class: 'num', text: shown })
        ]));
      });
    }
    renderOut();
    root.appendChild(rows);
    root.appendChild(formulas);
    if (inter.note && inter.note !== inter.prompt) root.appendChild(LK.h('p', { class: 'inter-note', text: inter.note }));
    ctx.setAction({ label: '我看明白了', disabled: true, onClick: function () { if (moved) finishOnce(ctx)(); } });
    return root;
  }

  function mountChoice(inter, ctx, kind) {
    const root = LK.h('div', { class: 'inter' });
    root.appendChild(LK.h('p', { class: 'inter-prompt', text: inter.prompt }));
    const salt = LKStore.get().seed + '|' + inter.prompt;
    const map = LK.shuffleIdx(inter.options.length, salt);
    const answer = map.indexOf(inter.answer);
    const go = finishOnce(ctx);
    let locked = false;
    if (kind === 'listen') {
      const bar = LK.h('div', { class: 'listen-bar' });
      if (LK.canSpeak()) {
        const play = LK.h('button', { class: 'speak-btn', 'aria-label': '播放' }, [LK.h('span', { text: '▶' })]);
        play.addEventListener('click', function () {
          const ok = LK.speak(inter.audio, LKStore.get().settings.ttsRate || 0.9);
          if (!ok) {
            play.remove();
            bar.appendChild(LK.h('p', { class: 'listen-text', text: inter.audio }));
            return;
          }
          play.classList.add('is-speaking');
          setTimeout(function () { play.classList.remove('is-speaking'); }, 1600);
        });
        bar.appendChild(play);
        bar.appendChild(LK.h('span', { class: 'listen-hint', text: '点一下，听这句话' }));
      } else {
        bar.appendChild(LK.h('p', { class: 'listen-text', text: inter.audio }));
      }
      root.appendChild(bar);
    }
    const list = LK.h('div', { class: 'opt-list' });
    const why = LK.h('div', { class: 'explain', hidden: true }, [
      LK.h('div', { class: 'explain-clip' }, [
        LK.h('p', { class: 'explain-k', text: '' }),
        LK.h('p', { class: 'explain-why', text: inter.why || '' })
      ])
    ]);
    const buttons = map.map(function (src, display) {
      const opt = inter.options[src];
      const btn = LK.h('button', { class: kind === 'swatch' ? 'swatch-opt' : 'opt listen-opt' });
      if (kind === 'swatch') {
        if (opt.weights) {
          const bar = LK.h('span', { class: 'swatch-weight' });
          const sum = opt.weights.reduce(function (a, b) { return a + b; }, 0) || 1;
          opt.colors.forEach(function (c, i) {
            bar.appendChild(LK.h('i', { style: { background: c, width: (opt.weights[i] / sum * 100) + '%' } }));
          });
          btn.appendChild(bar);
        } else {
          const row = LK.h('span', { class: 'swatch-row' });
          opt.colors.forEach(function (c) {
            row.appendChild(LK.h('i', { style: { background: c } }));
          });
          btn.appendChild(row);
        }
        btn.appendChild(LK.h('span', { class: 'swatch-label', text: opt.label }));
      } else {
        btn.textContent = typeof opt === 'string' ? opt : opt.label;
      }
      btn.addEventListener('click', function () {
        if (locked) return;
        if (btn.disabled) return;
        const ok = display === answer;
        list.querySelectorAll('.swatch-label').forEach(function (label) { label.classList.add('is-shown'); });
        if (ok) {
          locked = true;
          btn.classList.add('is-ok');
          LKMotion.bounce(btn);
          const starSlot = document.querySelector('.star-slot');
          if (starSlot) LKMotion.arcFly(btn, starSlot, { text: '★', duration: 560 });
          const mascot = document.querySelector('.lesson-mascot .mascot');
          if (mascot) LKMotion.celebrateMascot(mascot);
          why.querySelector('.explain-k').textContent = '对了';
          LKMotion.revealRows(why);
          ctx.setAction({ label: '继续', onClick: go });
        } else {
          btn.classList.add('is-bad');
          btn.disabled = true;
          LKMotion.shake(btn);
          why.querySelector('.explain-k').textContent = '差一点';
          setTimeout(function () {
            const good = buttons[answer];
            if (good) {
              good.classList.add('is-reveal');
              if (!LKMotion.reduce()) {
                good.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.02)' }, { transform: 'scale(1)' }], { duration: 220 });
              }
            }
          }, 200);
          LKMotion.revealRows(why, { delay: 250, duration: 420 });
        }
      });
      list.appendChild(btn);
      return btn;
    });
    root.appendChild(list);
    root.appendChild(why);
    ctx.setAction({ hidden: true });
    return root;
  }

  function mountMap(inter, ctx) {
    const root = LK.h('div', { class: 'inter' });
    root.appendChild(LK.h('p', { class: 'inter-prompt', text: inter.prompt }));
    const got = {};
    const go = finishOnce(ctx);
    const map = LKMap.mount({
      layer: inter.layer || 'province',
      lit: function (id) { return !!got[id]; },
      onTap: function (p, tile) {
        if (got[p.id]) return;
        if (inter.targets.indexOf(p.id) >= 0) {
          got[p.id] = true;
          const ns = LKMap.neighbors(p.id).map(function (n) { return map._tiles[n.id]; }).filter(function (n) {
            return n && n.classList.contains('is-lit');
          });
          LKMotion.lightTile(tile, ns);
          if (inter.targets.every(function (id) { return got[id]; })) {
            ctx.setAction({ label: '继续', onClick: go });
          }
        } else {
          LKMotion.shake(tile);
          const tip = LK.h('span', { class: 'tile-tip', text: p.name });
          tile.appendChild(tip);
          setTimeout(function () { tip.remove(); }, 900);
        }
      }
    });
    root.appendChild(map);
    ctx.setAction({ hidden: true });
    return root;
  }

  function mount(inter, ctx) {
    if (!inter) return LK.h('div');
    if (inter.type === 'order') return mountOrder(inter, ctx);
    if (inter.type === 'sort2') return mountSort(inter, ctx);
    if (inter.type === 'slider') return mountSlider(inter, ctx);
    if (inter.type === 'swatch') return mountChoice(inter, ctx, 'swatch');
    if (inter.type === 'listen') return mountChoice(inter, ctx, 'listen');
    if (inter.type === 'mapTap') return mountMap(inter, ctx);
    return LK.h('p', { text: '这个互动还没准备好。' });
  }

  global.LKInteract = { mount: mount };
})(window);

/* js/views/today.js */
(function (global) {
  function mount() {
    const state = LKStore.get();
    const day = state.currentDay;
    const dobj = LKCatalog.dayObj(day);
    const review = dobj && dobj.type === 'review';
    const screen = LK.h('div', { class: 'screen today-screen' });

    flameBtn.addEventListener('click', function () {
      LKSheet.toast('连续打卡 ' + (state.streak.count || 0) + ' 天。补签卡还剩 ' + state.streak.freezeLeft + ' 张。');
    });
    if (LKStore.consumeStreakBump()) LKMotion.flipNum(streakNum, String(state.streak.count || 0));

    const gear = LK.h('button', { class: 'icon-btn', 'aria-label': '设置' }, [LKIcons.gear()]);

    screen.appendChild(LK.h('header', { class: 'topbar' }, [

    ]));

    const bubble = LK.h('p', { class: 'bubble', text: LKCatalog.bubble(state) });
    screen.appendChild(LK.h('section', { class: 'greet' }, [LKMascot.create(64), bubble]));

    const done = LKCatalog.doneCount(day);
    screen.appendChild(ring(done));

    const chestOpen = !!state.dayCompletedDate[String(day)];
    if (done === 6 && !chestOpen) {
      const open = LK.h('button', { class: 'btn btn-gold', text: '打开今日宝箱' });
      open.addEventListener('click', function () { location.hash = '#/chest/' + day; });
      screen.appendChild(LK.h('div', { class: 'chest-cta' }, [open]));
    }
    if (chestOpen && day < 14) {
      screen.appendChild(LK.h('p', { class: 'banner', text: '今日已完成，明天解锁第 ' + (day + 1) + ' 天' }));
    }
    if (chestOpen && day === 14) {
      screen.appendChild(LK.h('section', { class: 'finale' }, [
        LK.h('h2', { text: '第一期完结' }),
        LK.h('p', { text: '下一期内容制作中。已经学过的关卡，都可以回看。' })
      ]));
    }

    let bossCard = null;
    if (review && dobj.boss) {
      const bossRec = state.lessons[LK.lessonId(day, 'boss')];
      bossCard = LK.h('button', { class: 'boss-card will-stagger' }, [
        LK.h('span', { class: 'boss-kicker', text: '跨科 Boss' }),
        LK.h('span', { class: 'card-title', text: dobj.boss.title }),
        LK.h('span', { class: 'card-meta' }, [
          LK.h('span', { text: bossRec ? (state.badges.indexOf(day === 14 ? 'week2' : 'week1') >= 0 ? '周徽章到手' : '已挑战') : '开始挑战' }),
          LK.h('span', { class: 'go', text: '→' })
        ])
      ]);
      bossCard.addEventListener('click', function () { location.hash = '#/lesson/' + day + '/boss'; });
    }

    const grid = LK.h('div', { class: 'card-grid' });
    SUBJECT_ORDER.forEach(function (key) {
      const sub = SUBJECTS[key];
      const les = LKCatalog.lesson(day, key);
      const rec = state.lessons[LK.lessonId(day, key)];
      const card = LK.h('button', { class: 'subj-card will-stagger' });
      card.style.background = sub.soft;
      card.appendChild(LK.h('span', { class: 'ord', text: String(sub.order) }));
      card.appendChild(LK.h('span', { class: 'emo', text: sub.icon }));
      card.appendChild(LK.h('span', { class: 'subname', text: sub.name, style: { color: sub.color } }));
      card.appendChild(LK.h('span', { class: 'card-title', text: review ? '回炉' : (les ? les.title : '') }));
      const meta = LK.h('span', { class: 'card-meta' });
      meta.appendChild(LK.h('span', { text: review ? '3 题' : ('约 ' + (les ? les.minutes : sub.minutes) + ' 分钟') }));
      meta.appendChild(rec ? LKIcons.stars(rec.best || rec.stars || 1, 3) : LK.h('span', { class: 'go', text: '→' }));
      card.appendChild(meta);
      card.addEventListener('click', function () {
        LKStore.clearWelcome();
        location.hash = '#/lesson/' + day + '/' + key;
      });
      grid.appendChild(card);
    });
    if (bossCard) screen.appendChild(bossCard);
    screen.appendChild(grid);
    requestAnimationFrame(function () { LKMotion.stagger(screen.querySelectorAll('.will-stagger')); });

    sw.addEventListener('click', function () {

      sw.classList.toggle('is-on', on);

    });
    screen.appendChild(LK.h('div', { class: 'mini-row' }, [
      LK.h('span', { text: '今天太忙？迷你模式 8 分钟' }),
      sw
    ]));
    return screen;
  }

  function ring(done) {
    const size = 120;
    const stroke = 12;
    const r = (size - stroke) / 2;
    const c = 2 * Math.PI * r;
    const gap = c * 0.018;
    const seg = c / 6 - gap;
    const svg = LK.svg('svg', { class: 'ring', viewBox: '0 0 120 120', width: '120', height: '120' });
    SUBJECT_ORDER.forEach(function (key, i) {
      const circle = LK.svg('circle', {
        cx: '60', cy: '60', r: String(r),
        fill: 'none',
        'stroke-width': String(stroke),
        'stroke-linecap': 'butt',
        'stroke-dasharray': seg + ' ' + (c - seg),
        'stroke-dashoffset': String(-i * (c / 6) + c / 4),
        stroke: i < done ? SUBJECTS[key].color : '#F4EEE6'
      });
      svg.appendChild(circle);
    });
    const wrap = LK.h('div', { class: 'ring-wrap' }, [
      svg,
      LK.h('div', { class: 'ring-label num' }, [
        LK.h('b', { text: String(done) }),
        LK.h('span', { text: ' / 6' })
      ])
    ]);
    return wrap;
  }

  global.LKToday = { mount: mount };
})(window);
