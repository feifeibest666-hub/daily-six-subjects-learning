  <script>
/* js/views/lesson.js */
(function (global) {
  function blocked(text) {
    const screen = LK.h('div', { class: 'screen' });
    screen.appendChild(LK.h('p', { class: 'empty', text: text }));
    screen.appendChild(LK.h('button', {
      class: 'btn btn-primary',
      text: '回首页',
      onClick: function () { location.hash = '#/today'; }
    }));
    return screen;
  }

  function mount(day, subject) {
    const les = LKCatalog.lesson(day, subject);
    if (!les) return blocked('没有这一关。');
    const state = LKStore.get();
    if (day > state.currentDay && !state.settings.debug) return blocked('这一天还没解锁。');
    const sub = subject === 'boss'
      ? { name: '跨科 Boss', color: '#C4842A', soft: '#FCF1DC' }
      : SUBJECTS[subject];

    const draft = state.draft && state.draft.id === les.id ? state.draft : null;
    const useMini = draft ? !!draft.mini : (!!state.miniOn && !les.boss);

    let quiz;
    if (draft && draft.quizKeys && draft.quizKeys.length) {
      quiz = draft.quizKeys.map(function (key) {
        const q = LKCatalog.findQuestion(key);
        return q ? LKCatalog.present(Object.assign({ review: key.indexOf(les.id) !== 0 }, q), state.seed) : null;
      }).filter(Boolean);
    } else {
      quiz = LKCatalog.buildQuiz(les, useMini);
    }
    if (!quiz.length) quiz = [{ key: les.id + '#x', q: '今天先回忆一句带走的话。', options: ['先记住带走的那一句', '跳过不看', '以后再说'], answer: 0, why: '回炉是为了把本周的话再站稳一次。', indexMap: [0, 1, 2] }];

    let phase = draft ? draft.phase : (les.boss ? 'intro' : (les.review ? 'recall' : 'hook'));
    let step = draft ? draft.step || 0 : 0;
    let qi = draft ? draft.qi || 0 : 0;
    let wrongs = draft ? draft.wrongs || 0 : 0;
    let correct = draft ? draft.correct || 0 : 0;
    let litStars = Math.min(3, correct);
    const elapsedBase = draft ? draft.elapsed || 0 : 0;
    const started = Date.now();
    if (qi >= quiz.length && phase === 'quiz') phase = les.boss ? 'intro' : 'take';

    const screen = LK.h('div', { class: 'screen lesson-screen' });
    screen.style.setProperty('--accent', sub.color);
    screen.style.setProperty('--soft', sub.soft);

    const segHost = LK.h('div', { class: 'seg-host' });
    const starHost = LK.h('div', { class: 'star-slot' });
    const mascotWrap = LK.h('div', { class: 'lesson-mascot' }, [LKMascot.create(40)]);
    const closeBtn = LK.h('button', { class: 'icon-btn', 'aria-label': '关闭' }, [LKIcons.closeIcon()]);
    const header = LK.h('header', { class: 'lesson-top' }, [closeBtn, segHost, starHost, mascotWrap]);
    const phaseBody = LK.h('div', { class: 'phase-body' });
    const footBtn = LK.h('button', { class: 'btn btn-primary', text: '继续' });
    const foot = LK.h('footer', { class: 'lesson-foot' }, [footBtn]);
    screen.appendChild(header);
    screen.appendChild(phaseBody);
    screen.appendChild(foot);

    function shownStars() {
      return litStars;
    }

    function segmentCount() {
      if (les.boss) return 1 + quiz.length;
      if (les.review) return 1 + quiz.length + 1;
      if (useMini) return 2 + quiz.length + 1;
      return 1 + (les.steps ? les.steps.length : 0) + (les.interaction ? 1 : 0) + quiz.length + 1;
    }

    function segmentIndex() {
      if (les.boss) return phase === 'intro' ? 0 : Math.min(segmentCount() - 1, 1 + qi);
      if (les.review) {
        if (phase === 'recall') return 0;
        if (phase === 'quiz') return 1 + qi;
        return segmentCount() - 1;
      }
      if (phase === 'hook') return 0;
      if (phase === 'steps') return 1 + step;
      let base = 1 + (useMini ? 1 : (les.steps || []).length);
      if (!useMini && les.interaction) {
        if (phase === 'interact') return base;
        base += 1;
      }
      if (phase === 'quiz') return base + qi;
      return segmentCount() - 1;
    }

    function paintChrome() {
      segHost.innerHTML = '';
      const total = segmentCount();
      const cur = segmentIndex();
      const row = LK.h('div', { class: 'segs', 'aria-hidden': 'true' });
      for (let i = 0; i < total; i++) {
        const seg = LK.h('span', { class: 'seg' + (i < cur ? ' is-done' : '') + (i === cur ? ' is-now' : '') });
        const fill = LK.h('i', { class: 'seg-fill' });
        if (i < cur) fill.style.transform = 'scaleX(1)';
        seg.appendChild(fill);
        row.appendChild(seg);
      }
      segHost.appendChild(row);
      starHost.innerHTML = '';
      starHost.appendChild(LKIcons.stars(shownStars(), 3));
    }

    function setAction(opts) {
      if (!opts || opts.hidden) {
        footBtn.hidden = true;
        return;
      }
      footBtn.hidden = false;
      footBtn.textContent = opts.label || '继续';
      footBtn.disabled = !!opts.disabled;
      footBtn.onclick = function () {
        if (footBtn.disabled) return;
        if (opts.onClick) opts.onClick();
      };
    }

    function saveDraft() {
      LKStore.setDraft({
        id: les.id,
        phase: phase,
        step: step,
        qi: qi,
        wrongs: wrongs,
        correct: correct,
        mini: useMini,
        elapsed: Date.now() - started + elapsedBase,
        quizKeys: quiz.map(function (q) { return q.key; })
      });
    }

    function finishLesson() {
      const ms = Date.now() - started + elapsedBase;
      const stars = LKCatalog.starsFor(wrongs);
      const badges = [];
      if (les.boss && wrongs === 0) {
        if (day === 7) badges.push('week1');
        if (day === 14) { badges.push('week2'); badges.push('season1'); }
      }
      const info = LKStore.completeLesson({
        id: les.id,
        day: day,
        stars: stars,
        ms: ms,
        mini: useMini,
        correct: correct,
        total: quiz.length,
        isBoss: !!les.boss,
        bossPerfect: !!(les.boss && wrongs === 0),
        pinIds: (les.pins || []).map(function (_, i) { return les.id + '#' + i; }),
        placeIds: (les.places || []).map(function (p) { return p.layer + ':' + p.id; }),
        badges: badges
      });
      try {
        sessionStorage.setItem('liuke.result', JSON.stringify({
          day: day,
          subject: subject,
          stars: stars,
          correct: correct,
          total: quiz.length,
          ms: ms,
          mini: useMini,
          first: info.first,
          boss: !!les.boss,
          perfect: !!(les.boss && wrongs === 0)
        }));
      } catch (e) {}
    }

    function goResult() {
      location.hash = '#/result/' + day + '/' + subject;
    }

    function stepNode(s, i, current) {
      const node = LK.h('button', {
        class: 'step' + (current ? ' is-current' : ' step-past'),
        'data-no-press': current ? null : '1'
      });
      if (!current) node.type = 'button';
      const bar = LK.h('i', { class: 'step-bar' });
      if (!current) bar.style.transform = 'scaleY(1)';
      node.appendChild(bar);
      node.appendChild(LK.h('span', { class: 'step-no', text: String(i + 1) }));
      const box = LK.h('span', { class: 'step-body' });
      box.appendChild(LK.h('span', { class: 'step-text', text: s.text }));
      if (s.formula) box.appendChild(LK.h('span', { class: 'formula num', text: s.formula }));
      if (s.visual) {
        const viz = LKVisuals.render(s.visual);
        if (viz) box.appendChild(viz);
      }
      node.appendChild(box);
      if (!current) {
        node.addEventListener('click', function () { node.classList.toggle('is-open'); });
      }
      return node;
    }

    function showHook() {
      phase = 'hook';
      phaseBody.innerHTML = '';
      const card = LK.h('div', { class: 'stage-card hook-card' });
      card.appendChild(LK.h('span', { class: 'tag', text: sub.name }));
      card.appendChild(LK.h('p', { class: 'hook-text', text: les.hook }));
      phaseBody.appendChild(card);
      setAction({
        label: '开始',
        onClick: function () {
          LKMotion.flip(card, function () {
            phase = 'steps';
            step = 0;
            fillSteps(card, false);
          });
        }
      });
      paintChrome();
      saveDraft();
    }

    function showSteps(index, animate) {
      phase = 'steps';
      step = index;
      phaseBody.innerHTML = '';
      const card = LK.h('div', { class: 'stage-card' });
      phaseBody.appendChild(card);
      fillSteps(card, animate);
    }

    function fillSteps(card, animate) {
      const n = useMini ? 1 : (les.steps || []).length;
      card.className = 'stage-card';
      card.innerHTML = '';
      card.appendChild(LK.h('h2', { class: 'card-h', text: les.title }));
      const list = LK.h('div', { class: 'step-list' });
      for (let i = 0; i <= step && i < n; i++) list.appendChild(stepNode(les.steps[i], i, i === step));
      card.appendChild(list);
      phaseBody.appendChild(card);
      if (animate) {
        const cur = list.querySelector('.is-current');
        LKMotion.stepIn(cur);
      } else {
        const bar = list.querySelector('.is-current .step-bar');
        if (bar) bar.style.transform = 'scaleY(1)';
      }
      function onNext() {
        if (step < n - 1) {
          const prev = list.querySelector('.is-current');
          if (prev) {
            prev.classList.remove('is-current');
            LKMotion.dim(prev);
          }
          step += 1;
          const node = stepNode(les.steps[step], step, true);
          list.appendChild(node);
          LKMotion.stepIn(node);
          paintChrome();
          saveDraft();
          setFoot();
          return;
        }
        if (!useMini && les.interaction) showInteract();
        else showQuiz();
      }
      function setFoot() {
        const last = step >= n - 1;
        setAction({ label: last ? '我懂了，去练一练' : ('下一步（' + (step + 1) + '/' + n + '）'), onClick: onNext });
      }
      setFoot();
      paintChrome();
      saveDraft();
    }

    function showInteract() {
      phase = 'interact';
      phaseBody.innerHTML = '';
      setAction({ hidden: true });
      const holder = LK.h('div', { class: 'stage-card inter-card' });
      phaseBody.appendChild(holder);
      const node = LKInteract.mount(les.interaction, {
        onDone: function () { showQuiz(); },
        setAction: setAction
      });
      holder.appendChild(node);
      paintChrome();
      saveDraft();
    }

    function showRecall() {
      phase = 'recall';
      phaseBody.innerHTML = '';
      const card = LK.h('div', { class: 'stage-card' });
      card.appendChild(LK.h('span', { class: 'tag', text: sub.name }));
      card.appendChild(LK.h('h2', { class: 'card-h', text: '本周带走' }));
      const ul = LK.h('ul', { class: 'take-list' });
      (les.takes || []).forEach(function (t) { ul.appendChild(LK.h('li', { text: t })); });
      card.appendChild(ul);
      phaseBody.appendChild(card);
      setAction({ label: '开始做题', onClick: showQuiz });
      paintChrome();
      saveDraft();
    }

    function showIntro() {
      phase = 'intro';
      phaseBody.innerHTML = '';
      const card = LK.h('div', { class: 'stage-card hook-card' });
      card.appendChild(LK.h('span', { class: 'tag', text: '跨科 Boss' }));
      card.appendChild(LK.h('h2', { class: 'card-h', text: les.title }));
      card.appendChild(LK.h('p', { class: 'hook-text', text: les.intro }));
      phaseBody.appendChild(card);
      setAction({ label: '开始挑战', onClick: showQuiz });
      paintChrome();
      saveDraft();
    }

    function showQuiz() {
      phase = 'quiz';
      if (qi >= quiz.length) {
        if (les.boss) { finishLesson(); goResult(); return; }
        showTake();
        return;
      }
      const q = quiz[qi];
      phaseBody.innerHTML = '';
      const card = LK.h('div', { class: 'stage-card q-card' });
      if (q.review || les.review) card.appendChild(LK.h('span', { class: 'tag', text: '回炉' }));
      card.appendChild(LK.h('p', { class: 'q-text', text: q.q }));
      const list = LK.h('div', { class: 'opt-list' });
      const explain = LK.h('div', { class: 'explain', hidden: true });
      const clip = LK.h('div', { class: 'explain-clip' });
      const kicker = LK.h('p', { class: 'explain-k' });
      clip.appendChild(kicker);
      clip.appendChild(LK.h('p', { class: 'explain-why', text: q.why }));
      explain.appendChild(clip);
      let answered = false;
      q.options.forEach(function (text, di) {
        const btn = LK.h('button', { class: 'opt', text: text });
        btn.addEventListener('click', function () {
          if (answered) return;
          answered = true;
          const ok = di === q.answer;
          if (ok) correct += 1;
          else wrongs += 1;
          LKStore.grade(q.key, ok, q.indexMap[di]);
          list.querySelectorAll('.opt').forEach(function (o) { o.disabled = true; });
          if (ok) {
            btn.classList.add('is-ok');
            LKMotion.bounce(card);
            LKMotion.celebrateMascot(mascotWrap.querySelector('.mascot'));
            kicker.textContent = '对了';
            const fly = LKMotion.arcFly(btn, starHost, { text: '★' });
            Promise.resolve(fly).then(function () {
              litStars = Math.min(3, correct);
              starHost.innerHTML = '';
              starHost.appendChild(LKIcons.stars(litStars, 3));
              const newest = starHost.querySelectorAll('.star-ico')[litStars - 1];
              if (newest) LKMotion.pop(newest);
              const fill = segHost.querySelector('.seg.is-now .seg-fill');
              LKMotion.growX(fill);
            });
          } else {
            btn.classList.add('is-bad');
            LKMotion.shake(btn);
            kicker.textContent = '差一点';
            setTimeout(function () {
              const good = list.querySelectorAll('.opt')[q.answer];
              if (!good) return;
              good.classList.add('is-reveal');
              if (!LKMotion.reduce()) {
                good.animate(
                  [{ transform: 'scale(1)' }, { transform: 'scale(1.02)' }, { transform: 'scale(1)' }],
                  { duration: 220, easing: 'cubic-bezier(.34,1.56,.64,1)' }
                );
              }
            }, 200);
          }
          LKMotion.revealRows(explain, ok ? null : { delay: 250, duration: 420 });
          paintChrome();
          qi += 1;
          saveDraft();
          qi -= 1;
          setAction({
            label: '继续',
            onClick: function () {
              qi += 1;
              if (qi < quiz.length) showQuiz();
              else if (les.boss) { finishLesson(); goResult(); }
              else showTake();
            }
          });
        });
        list.appendChild(btn);
      });
      card.appendChild(list);
      card.appendChild(explain);
      phaseBody.appendChild(card);
      setAction({ hidden: true });
      paintChrome();
      saveDraft();
    }

    function showTake() {
      phase = 'take';
      phaseBody.innerHTML = '';
      const card = LK.h('div', { class: 'stage-card take-card' });
      card.appendChild(LK.h('span', { class: 'tag', text: '今日带走' }));
      card.appendChild(LK.h('p', { class: 'take-text', text: les.take || '今天这一关先到这里。' }));
      if (les.tts && les.tts.length) {
        const box = LK.h('div', { class: 'tts-list' });
        les.tts.forEach(function (line) {
          if (!LK.canSpeak()) {
            box.appendChild(LK.h('p', { class: 'listen-text', text: line }));
            return;
          }
          const b = LK.h('button', { class: 'tts-btn', text: '▶  ' + line });
          b.addEventListener('click', function () {
            if (!LK.speak(line, LKStore.get().settings.ttsRate || 0.9)) {
              b.replaceWith(LK.h('p', { class: 'listen-text', text: line }));
              return;
            }
            b.classList.add('is-speaking');
            setTimeout(function () { b.classList.remove('is-speaking'); }, 1500);
          });
          box.appendChild(b);
        });
        card.appendChild(box);
      }
      if (les.pins && les.pins.length) {
        const preview = LK.h('div', { class: 'pin-preview' });
        preview.appendChild(LK.h('span', { class: 'preview-k', text: '已钉上时间轴' }));
        les.pins.slice(0, 4).forEach(function (p) {
          const pin = LK.h('span', { class: 'mini-pin' }, [
            LK.h('i', { class: 'ripple' }),
            LK.h('b', { text: p.label })
          ]);
          preview.appendChild(pin);
          requestAnimationFrame(function () { LKMotion.pinDrop(pin); });
        });
        card.appendChild(preview);
      }
      if (les.places && les.places.length) {
        const names = les.places.map(function (p) { return p.label; }).join('、');
        card.appendChild(LK.h('p', { class: 'place-preview', text: '已点亮地图 · ' + names }));
      }
      phaseBody.appendChild(card);
      setAction({
        label: '收下这张卡',
        onClick: function () {
          finishLesson();
          const target = document.querySelector('[data-tab="cards"]') || footBtn;
          const rect = card.getBoundingClientRect();
          const clone = card.cloneNode(true);
          clone.classList.add('fly-card');
          clone.style.position = 'fixed';
          clone.style.left = '0';
          clone.style.top = '0';
          clone.style.width = rect.width + 'px';
          clone.style.margin = '0';
          clone.style.zIndex = '80';
          clone.style.pointerEvents = 'none';
          document.body.appendChild(clone);
          const flight = LKMotion.arcFly(card, target, {
            flyer: clone,
            scaleTo: 0.3,
            rotate: 12,
            duration: 640,
            lift: 110
          });
          card.style.visibility = 'hidden';
          Promise.resolve(flight).then(function () {
            if (target.animate && !LKMotion.reduce()) {
              target.animate(
                [
                  { transform: 'translateY(0)' },
                  { transform: 'translateY(-6px)', offset: .45 },
                  { transform: 'translateY(0)' }
                ],
                { duration: 280, easing: 'cubic-bezier(.34,1.56,.64,1)' }
              );
            }
            const tabs = document.getElementById('tabbar');
            if (tabs) tabs.classList.remove('is-hidden');
            goResult();
          });
        }
      });
      paintChrome();
    }

    closeBtn.addEventListener('click', function () {
      LKSheet.confirm({
        title: '先离开这一关？',
        body: '进度会保存',
        ok: '先离开',
        cancel: '继续学习'
      }).then(function (yes) {
        if (!yes) return;
        saveDraft();
        location.hash = '#/today';
      });
    });

    if (phase === 'hook') showHook();
    else if (phase === 'steps') showSteps(step, false);
    else if (phase === 'interact') showInteract();
    else if (phase === 'recall') showRecall();
    else if (phase === 'intro') showIntro();
    else if (phase === 'quiz') showQuiz();
    else showTake();

    return screen;
  }

  global.LKLesson = { mount: mount };
})(window);

  <script>
/* js/views/result.js */
(function (global) {
  function mount(day, subject) {
    let saved = null;
    try { saved = JSON.parse(sessionStorage.getItem('liuke.result') || 'null'); } catch (e) {}
    const id = LK.lessonId(day, subject);
    const rec = LKStore.get().lessons[id];
    if (!rec && !(saved && saved.day === day && saved.subject === subject)) {
      location.hash = '#/today';
      return LK.h('div', { class: 'screen' });
    }
    const stars = saved && saved.day === day && saved.subject === subject ? saved.stars : (rec.stars || 1);
    const correct = saved && saved.correct != null ? saved.correct : (rec.correct || 0);
    const total = saved && saved.total != null ? saved.total : (rec.total || 0);
    const ms = saved && saved.ms != null ? saved.ms : (rec.ms || 0);
    const mini = saved ? saved.mini : rec.mini;
    const first = saved ? saved.first : false;
    const boss = subject === 'boss';
    const sub = boss ? { name: 'Boss', color: '#C4842A', soft: '#FCF1DC' } : SUBJECTS[subject];
    const screen = LK.h('div', { class: 'screen result-screen' });
    screen.style.setProperty('--accent', sub.color);
    screen.appendChild(LKMascot.create(88));
    const row = LK.h('div', { class: 'result-stars' });
    for (let i = 0; i < 3; i++) {
      const holder = LK.h('span', { class: 'result-star' + (i < stars ? ' is-on' : '') });
      holder.appendChild(LKIcons.star(i < stars));
      if (i >= stars) holder.style.opacity = '1';
      row.appendChild(holder);
    }
    screen.appendChild(row);
    requestAnimationFrame(function () {
      const nodes = row.querySelectorAll('.result-star.is-on .star-ico');
      nodes.forEach(function (n, i) {
        n.style.opacity = '0';
        if (LKMotion.reduce()) {
          n.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 120, delay: 0, fill: 'forwards' });
          return;
        }
        n.animate(
          [
            { transform: 'scale(0) rotate(-30deg)', opacity: 0 },
            { transform: 'scale(1.25) rotate(0deg)', opacity: 1, offset: .7 },
            { transform: 'scale(1) rotate(0deg)', opacity: 1 }
          ],
          { duration: 420, delay: i * 180, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'forwards' }
        );
      });
    });
    if (mini) screen.appendChild(LK.h('span', { class: 'mini-badge', text: '迷你' }));
    let retry = null;
    if (boss) {
      const perfect = !!(saved && saved.perfect);
      if (perfect) {
        const badge = LK.h('p', { class: 'badge-line', text: day === 14 ? '第 2 周徽章 · 第一期通关' : '第 1 周徽章' });
        screen.appendChild(badge);
        requestAnimationFrame(function () { LKMotion.pop(badge); });
      } else {
        const n = Math.max(0, total - correct);
        screen.appendChild(LK.h('p', { class: 'badge-miss', text: '差 ' + n + ' 题拿徽章' }));
        retry = LK.h('button', { class: 'btn btn-primary', text: '再挑战一次' });
        retry.addEventListener('click', function () {
          location.hash = '#/lesson/' + day + '/boss';
        });
      }
    }
    const stats = LK.h('ul', { class: 'stat-list' });
    stats.appendChild(LK.h('li', {}, [LK.h('span', { text: '答对' }), LK.h('b', { class: 'num', text: correct + ' / ' + total })]));
    stats.appendChild(LK.h('li', {}, [LK.h('span', { text: '用时' }), LK.h('b', { class: 'num', text: LK.formatDuration(ms) })]));
    if (!boss) {
      stats.appendChild(LK.h('li', {}, [
        LK.h('span', { text: first ? '新收集' : '图鉴' }),
        LK.h('b', { text: first ? '图鉴卡 1 张' : '图鉴卡已在册' })
      ]));
    }
    screen.appendChild(stats);
    if (retry) screen.appendChild(retry);
    const six = LKCatalog.sixDone(day);
    const next = LKCatalog.nextOpen(day, subject);
    if (six) {
      const b = LK.h('button', { class: 'btn btn-gold', text: '打开今日宝箱' });
      b.addEventListener('click', function () { location.hash = '#/chest/' + day; });
      screen.appendChild(b);
    } else if (next) {
      const b = LK.h('button', { class: 'btn btn-primary', text: '下一关：' + SUBJECTS[next].name });
      b.addEventListener('click', function () { location.hash = '#/lesson/' + day + '/' + next; });
      screen.appendChild(b);
    }
    const home = LK.h('button', { class: 'btn btn-secondary', text: '回首页' });
    home.addEventListener('click', function () { location.hash = '#/today'; });
    screen.appendChild(home);
    return screen;
  }

  global.LKResult = { mount: mount };
})(window);

/* js/views/chest.js */
(function (global) {
  function mount(day) {
    if (!LKCatalog.sixDone(day)) {
      location.hash = '#/today';
      return LK.h('div', { class: 'screen' });
    }
    const state = LKStore.get();
    const opened = !!state.dayCompletedDate[String(day)];
    const screen = LK.h('div', { class: 'screen chest-screen' });
    const stage = LK.h('div', { class: 'chest-stage' });
    const chest = LK.h('button', { class: 'chest', 'aria-label': '打开宝箱' });
    const lid = LK.h('span', { class: 'chest-lid' });
    const body = LK.h('span', { class: 'chest-body' }, [LK.h('i', { class: 'chest-lock' })]);
    chest.appendChild(lid);
    chest.appendChild(body);
    stage.appendChild(chest);
    const hint = LK.h('p', { class: 'chest-hint', text: opened ? '今日战报' : '点一下，打开今日宝箱' });
    screen.appendChild(hint);
    screen.appendChild(stage);
    const reportHost = LK.h('div', { class: 'report-host' });
    screen.appendChild(reportHost);

    function reportCard() {
      const st = LKStore.get();
      const card = LK.h('article', { class: 'report' });
      card.appendChild(LK.h('h2', { text: '今日战报' }));
      const ul = LK.h('ul', { class: 'report-takes' });
      let correct = 0;
      let total = 0;
      let ms = 0;
      let pins = 0;
      let places = 0;
      SUBJECT_ORDER.forEach(function (key) {
        const les = LKCatalog.lesson(day, key);
        const rec = st.lessons[LK.lessonId(day, key)];
        if (rec) {
          correct += rec.correct || 0;
          total += rec.total || 0;
          ms += rec.ms || 0;
        }
        if (les && les.pins) pins += les.pins.length;
        if (les && les.places) places += les.places.length;
        ul.appendChild(LK.h('li', {}, [
          LK.h('i', { class: 'dot', style: { background: SUBJECTS[key].color } }),
          LK.h('span', { text: les && les.take ? les.take : '' })
        ]));
      });
      card.appendChild(ul);
      const rate = total ? Math.round(correct / total * 100) : 0;
      card.appendChild(LK.h('p', { class: 'report-line' }, [document.createTextNode('总正确率 '), LK.h('b', { class: 'num', text: rate + '%' })]));
      card.appendChild(LK.h('p', { class: 'report-line' }, [document.createTextNode('总用时 '), LK.h('b', { class: 'num', text: LK.formatDuration(ms) })]));
      card.appendChild(LK.h('p', { class: 'report-line' }, [document.createTextNode('新钉上时间轴 '), LK.h('b', { class: 'num', text: pins + ' 处' })]));
      card.appendChild(LK.h('p', { class: 'report-line' }, [document.createTextNode('新点亮地图 '), LK.h('b', { class: 'num', text: places + ' 处' })]));
      card.appendChild(LK.h('p', { class: 'report-line' }, [document.createTextNode('连续打卡 '), LK.h('b', { class: 'num', text: (st.streak.count || 0) + ' 天' })]));
      if (st.badges.length) {
        card.appendChild(LK.h('p', { class: 'report-line', text: '徽章：' + st.badges.map(labelBadge).join('、') }));
      }
      const btn = LK.h('button', { class: 'btn btn-primary', text: '明天见' });
      btn.addEventListener('click', function () { location.hash = '#/today'; });
      card.appendChild(btn);
      return card;
    }

    function labelBadge(id) {
      if (id === 'week1') return '第 1 周';
      if (id === 'week2') return '第 2 周';
      if (id === 'season1') return '第一期通关';
      return id;
    }

    function reveal(animate) {
      const card = reportCard();
      reportHost.appendChild(card);
      chest.disabled = true;
      hint.textContent = '今日战报';
      if (!animate || LKMotion.reduce()) {
        lid.style.transform = 'perspective(600px) rotateX(70deg) translateY(-6px)';
        card.style.opacity = '1';
        return;
      }
      card.style.opacity = '0';
      card.style.transformOrigin = 'center top';
      LKMotion.playChest(chest, lid, function () {
        card.style.opacity = '1';
        card.animate(
          [
            { transform: 'translateY(-72px) scale(.35)', opacity: 0, transformOrigin: 'center top' },
            { transform: 'translateY(8px) scale(1.04)', opacity: 1, offset: .72, transformOrigin: 'center top' },
            { transform: 'translateY(0) scale(1)', opacity: 1, transformOrigin: 'center top' }
          ],
          { duration: 500, easing: 'cubic-bezier(.34,1.56,.64,1)', fill: 'forwards' }
        );
      });
    }

    if (opened) reveal(false);
    else {
      chest.addEventListener('click', function () {
        LKStore.openChest(day);
        reveal(true);
      });
    }
    return screen;
  }

  global.LKChest = { mount: mount };
})(window);

  <script>
/* js/views/timeline.js */
(function (global) {
  const MIN = -2600;
  const MAX = 2000;
  const SCALES = [
    { id: 'millennium', label: '千年', px: 0.24, tick: 500 },
    { id: 'century', label: '百年', px: 1.05, tick: 100 },
    { id: 'decade', label: '十年', px: 3.4, tick: 20 }
  ];

  function lanes(list) {
    const items = list.slice().sort(function (a, b) { return a.start - b.start || a.end - b.end; });
    const ends = [];
    items.forEach(function (d) {
      let lane = -1;
      for (let i = 0; i < ends.length; i++) {
        if (ends[i] <= d.start) { lane = i; break; }
      }
      if (lane < 0) { lane = ends.length; ends.push(d.end); }
      else ends[lane] = Math.max(ends[lane], d.end);
      d.lane = lane;
    });
    return items;
  }

  function mount() {
    const screen = LK.h('div', { class: 'screen timeline-screen' });
    screen.appendChild(LK.h('header', { class: 'topbar' }, [
      LK.h('div', { class: 'top-kicker', text: '时间轴' })
    ]));
    let scale = 0;
    const zoom = LK.h('div', { class: 'zoom-row' });
    const scroller = LK.h('div', { class: 'tl-scroll' });
    const canvas = LK.h('div', { class: 'tl-canvas' });
    const labels = LK.h('div', { class: 'tl-labels' }, [
      LK.h('span', { class: 'tl-lane-label is-cn', text: '中国' }),
      LK.h('span', { class: 'tl-lane-label is-world', text: '世界' })
    ]);
    scroller.appendChild(canvas);
    scroller.appendChild(labels);
    screen.appendChild(zoom);
    screen.appendChild(scroller);
    screen.appendChild(LK.h('p', { class: 'map-note', text: '上轨是中国，下轨是世界。虚线是还没学到的朝代。' }));

    let x = 0;
    let focused = false;
    let pointers = {};

    function latestLearnedYear() {
      let best = null;
      (DAYS || []).forEach(function (day) {
        if (!day.lessons) return;
        SUBJECT_ORDER.forEach(function (s) {
          const les = day.lessons[s];
          if (!les || !les.pins) return;
          les.pins.forEach(function (pin, i) {
            const pid = les.id + '#' + i;
            if (LKStore.get().pins.indexOf(pid) < 0) return;
            if (best == null || pin.year > best) best = pin.year;
          });
        });
      });
      return best == null ? -500 : best;
    }

    function focusLearned() {
      const sc = SCALES[scale];
      const view = scroller.clientWidth || 350;
      x = view / 2 - xOf(latestLearnedYear(), sc.px);
      clamp();
    }

    function xOf(year, px) { return (year - MIN) * px; }

    function draw() {
      const sc = SCALES[scale];
      const width = Math.ceil((MAX - MIN) * sc.px) + 40;
      canvas.style.width = width + 'px';
      canvas.innerHTML = '';
      const china = LK.h('div', { class: 'tl-china' });
      const axis = LK.h('div', { class: 'tl-axis' });
      const world = LK.h('div', { class: 'tl-world' });
      const dyns = lanes(DYNASTIES.map(function (d) { return Object.assign({}, d); }));
      dyns.forEach(function (d) {
        const learned = LKCatalog.dynastyLearned(d.name);
        const left = xOf(d.start, sc.px);
        const w = Math.max(8, xOf(d.end, sc.px) - left);
        const band = LK.h('button', {
          class: 'band' + (learned ? ' is-solid' : ' is-dashed'),
          style: { left: left + 'px', width: w + 'px', top: (52 + d.lane * 28) + 'px' }
        });
        band.textContent = w < 36 ? d.name.slice(0, 1) : (d.approx ? '约' + d.name : d.name);
        band.addEventListener('click', function () { openDynasty(d, learned); });
        china.appendChild(band);
      });
      (DAYS || []).forEach(function (day) {
        if (!day.lessons) return;
        SUBJECT_ORDER.forEach(function (s) {
          const les = day.lessons[s];
          if (!les || !les.pins) return;
          les.pins.forEach(function (pin, i) {
            const pid = les.id + '#' + i;
            if (LKStore.get().pins.indexOf(pid) < 0) return;
            if (pin.kind === 'dynasty') return;
            const host = pin.track === 'world' ? world : china;
            const pinEl = LK.h('button', {
              class: 'pin ' + (pin.track === 'world' ? 'is-world' : 'is-cn'),
              style: { left: xOf(pin.year, sc.px) + 'px', top: ((i % 2) * 18) + 'px' }
            });
            pinEl.appendChild(LK.h('span', { class: 'pin-label', text: pin.label }));
            pinEl.appendChild(LK.h('span', { class: 'pin-stem' }));
            const dot = LK.h('span', { class: 'pin-dot' }, [LK.h('i', { class: 'ripple' })]);
            pinEl.appendChild(dot);
            pinEl.addEventListener('click', function () { openPin(les, pin); });
            host.appendChild(pinEl);
            requestAnimationFrame(function () { LKMotion.pinDrop(dot); });
          });
        });
      });
      for (let y = Math.ceil(MIN / sc.tick) * sc.tick; y <= MAX; y += sc.tick) {
        const tick = LK.h('span', { class: 'tick', style: { left: xOf(y, sc.px) + 'px' } });
        tick.appendChild(LK.h('i'));
        tick.appendChild(LK.h('b', { class: 'num', text: LK.yearText(y) }));
        axis.appendChild(tick);
      }
      canvas.appendChild(china);
      canvas.appendChild(axis);
      canvas.appendChild(world);
      if (!focused) {
        focused = true;
        focusLearned();
      }
      clamp();
      canvas.style.transform = 'translateX(' + x + 'px)';
    }

    function clamp() {
      const width = canvas.offsetWidth;
      if (!width) return;
      const view = scroller.clientWidth || 350;
      const minX = Math.min(0, view - width - 8);
      x = LK.clamp(x, minX, 0);
    }

    function openDynasty(d, learned) {
      const dayNum = learned ? +learned.id.slice(1, 3) : +d.lesson.slice(1, 3);
      LKSheet.open(function (body) {
        body.appendChild(LK.h('h2', { class: 'sheet-title', text: (d.approx ? '约 ' : '') + d.name }));
        body.appendChild(LK.h('p', { class: 'sheet-copy num', text: LK.yearText(d.start) + ' — ' + LK.yearText(d.end) }));
        if (learned) {
          body.appendChild(LK.h('p', { class: 'sheet-copy', text: learned.take }));
          const btn = LK.h('button', { class: 'btn btn-primary', text: '回看这一关' });
          btn.addEventListener('click', function () { location.hash = '#/review/' + dayNum + '/history'; });
          body.appendChild(btn);
        } else {
          body.appendChild(LK.h('p', { class: 'sheet-copy', text: '还没学到。第 ' + dayNum + ' 天见。' }));
        }
      });
    }

    function openPin(les, pin) {
      const dayNum = +les.id.slice(1, 3);
      const subject = les.id.split('-')[1];
      LKSheet.open(function (body) {
        body.appendChild(LK.h('h2', { class: 'sheet-title', text: pin.label }));
        body.appendChild(LK.h('p', { class: 'sheet-copy num', text: LK.yearText(pin.year) }));
        body.appendChild(LK.h('p', { class: 'sheet-copy', text: les.take }));
        const btn = LK.h('button', { class: 'btn btn-primary', text: '回看这一关' });
        btn.addEventListener('click', function () { location.hash = '#/review/' + dayNum + '/' + subject; });
        body.appendChild(btn);
      });
    }

    SCALES.forEach(function (sc, i) {
      const b = LK.h('button', { class: 'zoom-btn' + (i === scale ? ' is-on' : ''), text: sc.label });
      b.addEventListener('click', function () {
        scale = i;
        zoom.querySelectorAll('.zoom-btn').forEach(function (n, k) { n.classList.toggle('is-on', k === scale); });
        draw();
      });
      zoom.appendChild(b);
    });

    let drag = null;
    let vel = 0;
    scroller.addEventListener('pointerdown', function (e) {
      pointers[e.pointerId] = e.clientX;
      drag = { x: e.clientX, origin: x, t: performance.now(), last: e.clientX };
      vel = 0;
      try { scroller.setPointerCapture(e.pointerId); } catch (err) {}
    });
    scroller.addEventListener('pointermove', function (e) {
      if (pointers[e.pointerId] != null) pointers[e.pointerId] = e.clientX;
      const ids = Object.keys(pointers);
      if (ids.length >= 2) {
        const dist = Math.abs(pointers[ids[0]] - pointers[ids[1]]);
        if (!scroller._pinch) scroller._pinch = dist;
        else if (dist > scroller._pinch * 1.28 && scale < 2) { scale += 1; scroller._pinch = dist; draw(); syncZoom(); }
        else if (dist < scroller._pinch * 0.78 && scale > 0) { scale -= 1; scroller._pinch = dist; draw(); syncZoom(); }
        return;
      }
      if (!drag) return;
      const now = performance.now();
      const dx = e.clientX - drag.last;
      const dt = Math.max(16, now - drag.t);
      vel = dx / dt;
      drag.last = e.clientX;
      drag.t = now;
      x = drag.origin + (e.clientX - drag.x);
      clamp();
      canvas.style.transform = 'translateX(' + x + 'px)';
    });
    function endPointer(e) {
      delete pointers[e.pointerId];
      if (Object.keys(pointers).length < 2) scroller._pinch = null;
      if (!drag) return;
      drag = null;
      const view = scroller.clientWidth || 350;
      const minX = Math.min(0, view - canvas.offsetWidth - 8);
      const dest = LK.clamp(x + vel * 420, minX, 0);
      const from = x;
      const t0 = performance.now();
      function frame(now) {
        const t = Math.min(1, (now - t0) / 600);
        const e = LK.ease.out(t);
        x = from + (dest - from) * e;
        canvas.style.transform = 'translateX(' + x + 'px)';
        if (t < 1) requestAnimationFrame(frame);
      }
      if (!LKMotion.reduce()) requestAnimationFrame(frame);
      else { x = dest; canvas.style.transform = 'translateX(' + x + 'px)'; }
    }
    scroller.addEventListener('pointerup', endPointer);
    scroller.addEventListener('pointercancel', endPointer);
    function syncZoom() {
      zoom.querySelectorAll('.zoom-btn').forEach(function (n, k) { n.classList.toggle('is-on', k === scale); });
    }
    draw();
    let settleTries = 0;
    function settle() {
      settleTries += 1;
      if ((!scroller.isConnected || !scroller.clientWidth || !canvas.offsetWidth) && settleTries < 40) {
        requestAnimationFrame(settle);
        return;
      }
      focusLearned();
      canvas.style.transform = 'translateX(' + x + 'px)';
    }
    requestAnimationFrame(settle);
    return screen;
  }

  global.LKTimeline = { mount: mount };
})(window);

</script>

              else LKMotion.bounce(opt);

              setTimeout(function () { location.hash = '#/mistakes'; global.LKRouter.go && LKRouter.go(); }, 700);
            });
            practice.appendChild(opt);
          });
        });
        card.appendChild(btn);

    screen.appendChild(LK.h('p', { class: 'map-note', text: '已掌握 ' + state.mastered.length + ' 题' }));

    ver.addEventListener('pointerup', function () { clearTimeout(timer); });
    ver.addEventListener('pointerleave', function () { clearTimeout(timer); });
    screen.appendChild(ver);

    const debug = LK.h('section', { class: 'debug-box' });
    debug.hidden = !state.settings.debug;
    debug.appendChild(LK.h('p', { class: 'set-label', text: '跳到第 N 天（测试用）' }));
    const input = LK.h('input', { type: 'number', min: '1', max: '14', value: String(state.currentDay), 'aria-label': '学习日' });
    const jump = LK.h('button', { class: 'btn btn-primary', text: '跳转' });
    jump.addEventListener('click', function () {
      LKStore.jumpDay(Number(input.value) || 1);
      location.hash = '#/today';
    });
    debug.appendChild(input);
    debug.appendChild(jump);
    screen.appendChild(debug);
    return screen;
  }

  function row(label, control) {
    return LK.h('div', { class: 'set-row' }, [LK.h('span', { text: label }), control]);
  }

  function switchBtn(on, fn) {
    const sw = LK.h('button', {
      class: 'switch' + (on ? ' is-on' : ''),
      role: 'switch',
      'aria-checked': on ? 'true' : 'false'
    });
    sw.appendChild(LK.h('i'));
    sw.addEventListener('click', function () {
      const next = !sw.classList.contains('is-on');
      sw.classList.toggle('is-on', next);
      sw.setAttribute('aria-checked', next ? 'true' : 'false');
      fn(next);
    });
    return sw;
  }

  global.LKSettings = { mount: mount };
})(window);

</script>

/* js/views/review.js */
(function (global) {
  function mount(day, subject) {
    const les = LKCatalog.lesson(day, subject);
    if (!les || subject === 'boss') {
      location.hash = '#/today';
      return LK.h('div', { class: 'screen' });
    }
    const sub = SUBJECTS[subject];
    const screen = LK.h('div', { class: 'screen review-screen' });
    screen.style.setProperty('--accent', sub.color);
    const back = LK.h('button', { class: 'icon-btn', 'aria-label': '返回' }, [LKIcons.closeIcon()]);
    back.addEventListener('click', function () {
      if (history.length > 1) history.back();
      else location.hash = '#/today';
    });
    screen.appendChild(LK.h('header', { class: 'lesson-top' }, [
      back,
      LK.h('div', { class: 'top-kicker', text: sub.name + ' · 回看' })
    ]));
    const card = LK.h('article', { class: 'stage-card' });
    card.appendChild(LK.h('h2', { class: 'card-h', text: les.review ? '本周回炉' : les.title }));
    if (les.take) card.appendChild(LK.h('p', { class: 'take-text', text: les.take }));
    if (les.takes) {
      const ul = LK.h('ul', { class: 'take-list' });
      les.takes.forEach(function (t) { ul.appendChild(LK.h('li', { text: t })); });
      card.appendChild(ul);
    }
    if (les.steps) {
      const list = LK.h('div', { class: 'step-list' });
      les.steps.forEach(function (s, i) {
        const node = LK.h('div', { class: 'step is-open' });
        const bar = LK.h('i', { class: 'step-bar' });
        bar.style.transform = 'scaleY(1)';
        node.appendChild(bar);
        node.appendChild(LK.h('span', { class: 'step-no', text: String(i + 1) }));
        const box = LK.h('span', { class: 'step-body' });
        box.appendChild(LK.h('span', { class: 'step-text', text: s.text }));
        if (s.formula) box.appendChild(LK.h('span', { class: 'formula num', text: s.formula }));
        if (s.visual) {
          const viz = LKVisuals.render(s.visual);
          if (viz) box.appendChild(viz);
        }
        node.appendChild(box);
        list.appendChild(node);
      });
      card.appendChild(list);
    }
    const redo = LK.h('button', { class: 'btn btn-primary', text: '重做这一关' });
    redo.addEventListener('click', function () {
      const draft = LKStore.get().draft;
      if (draft && draft.id === les.id) LKStore.clearDraft();
      location.hash = '#/lesson/' + day + '/' + subject;
    });
    card.appendChild(redo);
    screen.appendChild(card);
    return screen;
  }

  global.LKReview = { mount: mount };
})(window);

</script>
  <script>
/* js/router.js */
(function (global) {
  const TOPS = { today: true, timeline: true, map: true, cards: true };

  function parse(hash) {
    const raw = (hash || '#/today').replace(/^#/, '');
    const parts = raw.split('/').filter(Boolean);
    const name = parts[0] || 'today';
    return { name: name, day: parts[1] ? +parts[1] : null, subject: parts[2] || null };
  }

  function render(route) {
    if (route.name === 'today') return LKToday.mount();
    if (route.name === 'lesson') return LKLesson.mount(route.day, route.subject);
    if (route.name === 'result') return LKResult.mount(route.day, route.subject);
    if (route.name === 'chest') return LKChest.mount(route.day);
    if (route.name === 'timeline') return LKTimeline.mount();
    if (route.name === 'map') return LKMapView.mount();
    if (route.name === 'cards') return LKCards.mount();
    if (route.name === 'mistakes') return LKMistakes.mount();
    if (route.name === 'settings') return LKSettings.mount();
    if (route.name === 'review') return LKReview.mount(route.day, route.subject);
    return LKToday.mount();
  }

  let busy = false;
  let queued = false;
  async function go() {
    if (busy) { queued = true; return; }
    busy = true;
    const route = parse(location.hash);
    const stage = document.getElementById('stage');
    const tabs = document.getElementById('tabbar');
    let next;
    try {
      next = render(route);
    } catch (err) {
      console.error(err);
      next = LK.h('div', { class: 'screen' }, [
        LK.h('p', { class: 'empty', text: '这一页没能打开。' }),
        LK.h('button', { class: 'btn btn-primary', text: '回首页', onClick: function () { location.hash = '#/today'; } })
      ]);
    }
    const prev = stage.querySelector(':scope > .screen');
    if (prev) {
      try { await LKMotion.leave(prev); } catch (e) {}
      prev.remove();
    }
    stage.appendChild(next);
    const top = !!TOPS[route.name];
    tabs.classList.toggle('is-hidden', !top);
    next.classList.toggle('has-tab', top);
    tabs.querySelectorAll('a.tab').forEach(function (a) {
      a.classList.toggle('is-on', a.dataset.tab === route.name);
    });
    try { await LKMotion.enter(next); } catch (e) {}
    stage.scrollTop = 0;
    busy = false;
    if (queued) { queued = false; go(); }
  }

  function start() {
    window.addEventListener('hashchange', function () { go(); });
    if (!location.hash || location.hash === '#') location.hash = '#/today';
    else go();
  }

  global.LKRouter = { start: start, go: go };
})(window);

</script>
  <script>
/* js/app.js */
(function () {
  function boot() {
    LKStore.init();
    LKMotion.init();
    const notice = LKStore.consumeNotice();
    LKRouter.start();
    if (notice === 'freeze') {
      const left = LKStore.get().streak.freezeLeft;
      setTimeout(function () {
        LKSheet.toast('用了一张补签卡。连续打卡还在，这个月还剩 ' + left + ' 张。');
      }, 400);
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
